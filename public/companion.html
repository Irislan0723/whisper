.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(42,35,39,.26);backdrop-filter:blur(7px)}.start-card,.timer-card{box-sizing:border-box;width:min(365px,calc(100vw - 40px));padding:25px 22px;border:1px solid var(--border);border-radius:25px;background:var(--bg-card);box-shadow:var(--shadow-md);text-align:center}.start-card h2{margin:0;color:var(--text-light);font-size:14px;font-weight:400}.start-card strong{display:block;margin:13px 0 21px;font:400 42px var(--font-d);letter-spacing:.06em}.primary{width:100%;padding:12px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-contrast);cursor:pointer}.link{margin-top:11px;border:0;background:none;color:var(--text-mid);font-size:13px;cursor:pointer}.timer-sheet{z-index:11;align-items:flex-start;padding-top:calc(118px + env(safe-area-inset-top));background:rgba(42,35,39,.1);backdrop-filter:blur(3px)}.timer-card{text-align:left;padding:18px}.timer-card h2{margin:0 0 15px;text-align:center;font:400 27px var(--font-d)}.timer-line{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);color:var(--text-mid);font-size:13px}.timer-line strong{color:var(--text);font-weight:500}.timer-actions{display:flex;gap:8px;margin-top:14px}.minor{flex:1;padding:9px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);cursor:pointer}.danger{color:var(--error)}

<body><main class="room"><div class="art" id="art"></div><div class="shade"></div>
<header class="appbar" id="appbar"><a class="round" id="back" aria-label="返回聊天"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a><h1 id="title">陪伴</h1><div class="bar-actions"><button class="round" id="openSettings" aria-label="房间设置"><svg viewBox="0 0 24 24"><path d="M9.7 3.3 9.1 5a7.4 7.4 0 0 0-1.7 1L5.6 5.6 3.3 9.7 4.7 11a7.8 7.8 0 0 0 0 2l-1.4 1.3 2.3 4.1 1.8-.4a7.4 7.4 0 0 0 1.7 1l.6 1.7h4.6l.6-1.7a7.4 7.4 0 0 0 1.7-1l1.8.4 2.3-4.1-1.4-1.3a7.8 7.8 0 0 0 0-2l1.4-1.3-2.3-4.1-1.8.4a7.4 7.4 0 0 0-1.7-1l-.6-1.7H9.7Z"/><circle cx="12" cy="12" r="3.2"/></svg></button><button class="round" id="hideBar" aria-label="收起顶栏"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button></div></header><button class="round show-bar hidden" id="showBar" aria-label="展开顶栏"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
<button class="clock hidden" id="clock">--:--</button><section class="chat-zone" id="chatZone"><div class="messages" id="messages"></div></section><form class="composer" id="composer" autocomplete="off"><div class="composer-row"><button class="round" type="button" id="collapse" aria-label="收起聊天"><svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></button><div class="compose-box"><input id="input" name="companion-message" maxlength="1600" placeholder="Message TA..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other"></div><button class="round ask" type="button" id="ask" aria-label="让 TA 回复"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg></button><button class="round send" type="submit" aria-label="发送"><svg viewBox="0 0 24 24"><path d="m21 3-7.4 18-3.8-7.2L3 10.2 21 3Z"/><path d="m9.8 13.8 4.4-4.4"/></svg></button></div></form><button class="round collapsed-toggle hidden" id="expand" aria-label="展开聊天"><svg viewBox="0 0 24 24"><path d="m7 15 5-5 5 5"/></svg></button></main>
<section class="overlay hidden" id="startOverlay"><div class="start-card"><h2 id="startScene">学习陪伴</h2><strong id="startTime">00:25:00</strong><button class="primary" id="start">开始</button><button class="link" id="goSettings">去设置</button></div></section>
<section class="overlay timer-sheet hidden" id="timerOverlay"><div class="timer-card"><h2 id="timerTime">--:--</h2><div class="timer-line"><span>AI 回复</span><strong id="nextAuto">已关闭</strong></div><div class="timer-actions"><button class="minor" id="pause">暂停</button><button class="minor danger" id="end">结束</button></div></div></section>
<section class="sheet hidden" id="sheet"><div class="sheet-card"><div class="grab"></div><header class="sheet-head"><h2>Room Settings</h2><button class="x" id="closeSettings">×</button></header>
<label class="field"><span>壁纸</span><span class="file-row"><input type="file" id="wallpaper" accept="image/*"><button class="delete-wall" id="clearWallpaper" type="button" aria-label="删除壁纸"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/></svg></button></span></label>
<label class="field"><span>白噪音</span><select id="ambient"><option value="rain">雨声</option><option value="waves">海浪</option><option value="fire">壁炉</option><option value="cafe">咖啡馆</option><option value="wind">风声</option><option value="none">关闭</option></select></label>
<label class="field"><span>AI 主动关心</span><input class="switch" id="auto" type="checkbox"></label>
<label class="field" id="intervalRow"><span>回复间隔</span><span><select id="interval"><option value="5">5 分钟</option><option value="10">10 分钟</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="custom">自定义…</option></select><input class="hidden" id="intervalCustom" type="number" min="1" max="720" placeholder="分钟"></span></label>
<label class="field hidden" id="rangeRow"><span>主动关心范围</span><span><select id="range"><option value="30">30 分钟</option><option value="60">60 分钟</option><option value="90">90 分钟</option><option value="custom">自定义…</option></select><input class="hidden" id="rangeCustom" type="number" min="1" max="720" placeholder="分钟"></span></label>
<details class="setting-section"><summary>气泡设置</summary><label class="field"><span>我的气泡</span><span class="color-control"><input id="userBubble" type="color"><input id="userBubbleCode" type="text" maxlength="7" placeholder="#E9D8D8"></span></label><label class="field"><span>TA 的气泡</span><span class="color-control"><input id="taBubble" type="color"><input id="taBubbleCode" type="text" maxlength="7" placeholder="#FFFFFF"></span></label><label class="field"><span>我的文字</span><span class="color-control"><input id="userText" type="color"><input id="userTextCode" type="text" maxlength="7" placeholder="#392E31"></span></label><label class="field"><span>TA 的文字</span><span class="color-control"><input id="taText" type="color"><input id="taTextCode" type="text" maxlength="7" placeholder="#392E31"></span></label><label class="field"><span>气泡透明度</span><input class="range" id="opacity" type="range" min="20" max="100"></label><label class="field"><span>气泡宽度</span><input class="range" id="bubbleWidth" type="range" min="45" max="100"></label><label class="field"><span>文字大小</span><input class="range" id="bubbleFontSize" type="range" min="12" max="24"></label></details><button class="primary" id="saveSettings">保存设置</button></div></section><div class="toast hidden" id="toast"></div>
<script>
(()=>{const KEY='iris-memory-2024',H={'x-api-key':KEY,'Content-Type':'application/json'},$=id=>document.getElementById(id),p=new URLSearchParams(location.search),id=p.get('session'),chat=p.get('chat');let s,settings={wallpapers:{}},last=Date.now();const names={study:'学习',vocabulary:'背单词',exercise:'运动',sleep:'睡眠',bath:'沐浴',custom:'自定义'},esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),api=async(a,o={})=>{const r=await fetch(a,{...o,headers:{...H,...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d},say=x=>{$('toast').textContent=x;$('toast').classList.remove('hidden');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.add('hidden'),2400)},fmt=x=>{x=Math.max(0,Math.floor(x||0));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')},full=x=>{x=Math.max(0,Math.floor(x||0));return String(Math.floor(x/3600)).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')},baseKey=()=>`${s?.roleId||'default'}:${s?.scene||'custom'}`,key=()=>s?.scene==='sleep'?baseKey()+':'+(s?.sleepMode==='night'?'night':'nap'):baseKey(),wallpaper=()=>{const walls=settings.wallpapers||{};return Object.hasOwn(walls,key())?walls[key()]:(walls[baseKey()]||'')},elapsed=()=>{const base=Number(s?.elapsedSeconds)||0,from=s?.status==='active'&&s?.lastResumedAt?new Date(s.lastResumedAt).getTime():0;return Math.max(0,base+(from?(Date.now()-from)/1000:0))},seconds=()=>s.timerMode==='elapsed'?elapsed():s.remainingSeconds||0,rgba=(h,o)=>{h=String(h||'#ffffff').replace('#','');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${o})`};
function rememberRoute(){if(s?.id)localStorage.setItem('iris-last-route-v33',JSON.stringify({kind:'companion',session:s.id,chat:chat||s.conversationId||'',at:Date.now()}))}function rememberChatRoute(){localStorage.setItem('iris-last-route-v33',JSON.stringify({kind:'chat',conversation:chat||s?.conversationId||'',at:Date.now()}))}function appearance(){const a=s.appearance||{},o=Number(a.opacity)||.88,d=document.documentElement;d.style.setProperty('--user-bubble',rgba(a.userBubble||'#e9d8d8',o));d.style.setProperty('--ta-bubble',rgba(a.taBubble||'#ffffff',o));d.style.setProperty('--user-text',a.userText||'#392e31');d.style.setProperty('--ta-text',a.taText||'#392e31');d.style.setProperty('--companion-bubble-width',(Number(a.bubbleWidth)||100)+'%');d.style.setProperty('--companion-bubble-font-size',(Number(a.bubbleFontSize)||12)+'px')}function timeOf(m){return new Date(m.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}function groups(){const out=[];for(const m of s.messages||[]){const groupId=m.role==='claude'?(m.replyGroupId||m.id):m.id,previous=out.at(-1);if(previous&&previous.role===m.role&&previous.id===groupId)previous.messages.push(m);else out.push({id:groupId,role:m.role,messages:[m]})}return out}function render(){if(!s)return;const list=$('messages'),stickToBottom=!list.dataset.rendered||list.scrollTop+list.clientHeight>=list.scrollHeight-28;const ready=s.status==='ready';$('title').textContent=s.name||names[s.scene]||'陪伴';$('startScene').textContent=(s.name||names[s.scene]||'陪伴')+'陪伴';$('startTime').textContent=full(s.timerMode==='elapsed'?0:s.remainingSeconds);$('startOverlay').classList.toggle('hidden',!ready);$('clock').classList.toggle('hidden',ready||s.status==='ended');$('clock').textContent=fmt(seconds());$('timerTime').textContent=fmt(seconds());$('pause').textContent=s.status==='paused'?'继续':'暂停';const n=s.autoEnabled&&s.nextAutoAt?Math.max(0,(new Date(s.nextAutoAt)-Date.now())/1000):null;$('nextAuto').textContent=n===null?'已关闭':n<=0?'即将回复':`还有 ${fmt(n)}`;const wall=wallpaper();$('art').style.backgroundImage=wall?`url("${wall.replace(/"/g,'%22')}")`:'';appearance();list.innerHTML=groups().map(g=>{const user=g.role==='iris',stack='<div class="bubble-stack">'+g.messages.map(m=>`<div class="bubble ${user?'iris':'claude'}">${esc(m.content)}</div>`).join('')+'</div>',time=`<time class="message-time">${timeOf(user?g.messages[0]:g.messages.at(-1))}</time>`;return `<div class="message-group ${user?'user':'assistant'}">${user?time+stack:stack+time}</div>`}).join('');list.dataset.rendered='1';if(stickToBottom)list.scrollTop=list.scrollHeight}
async function save(extra={}){s=await api('/api/companion/sessions/'+s.id,{method:'PUT',body:JSON.stringify({status:s.status,remainingSeconds:s.remainingSeconds,...extra})});render()}async function refresh(){try{if(s?.status==='active'&&s.timerMode==='countdown')await save();const d=await api('/api/companion/sessions'),n=d.sessions.find(x=>x.id===id);if(n){s=n;render()}}catch(_){}}async function fileData(f){const raw=await new Promise((yes,no)=>{const r=new FileReader;r.onload=()=>yes(r.result);r.onerror=no;r.readAsDataURL(f)});return new Promise(yes=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1200/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=i.naturalWidth*k;c.height=i.naturalHeight*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);yes(c.toDataURL('image/jpeg',.82))};i.onerror=()=>yes(raw);i.src=raw})}
async function start(){try{$('start').disabled=true;s=await api('/api/companion/sessions/'+s.id+'/start',{method:'POST'});try{s=(await api('/api/companion/sessions/'+s.id+'/greet',{method:'POST'})).session}catch(_){say('已开始；TA 的问候暂时没有发出')}rememberRoute();last=Date.now();render()}catch(e){say(e.message)}finally{$('start').disabled=false}}async function complete(){try{const data=await api('/api/companion/sessions/'+s.id+'/complete',{method:'POST'});s=data.session;rememberChatRoute();return data}catch(e){say(e.message);throw e}}function tick(){if(!s||s.status!=='active')return;const now=Date.now(),d=Math.max(0,Math.floor((now-last)/1000));last=now;if(s.timerMode==='countdown'){s.remainingSeconds=Math.max(0,s.remainingSeconds-d);if(!s.remainingSeconds){say('这次陪伴到这里啦');complete().then(()=>setTimeout(back,550)).catch(()=>{})}}render()}const back=()=>{rememberChatRoute();location.href='chat.html'+(chat?'?conversation='+encodeURIComponent(chat):'')};async function finishAndBack(){if(!s||s.status==='ended'||s.status==='ready')return back();const button=$('back');try{button.disabled=true;await complete();back()}catch(e){say(e.message);button.disabled=false}}
 $('back').onclick=e=>{e.preventDefault();finishAndBack()};$('start').onclick=start;$('goSettings').onclick=openSettings;$('hideBar').onclick=()=>{$('appbar').classList.add('is-collapsed');$('showBar').classList.remove('hidden')};$('showBar').onclick=()=>{$('appbar').classList.remove('is-collapsed');$('showBar').classList.add('hidden')};$('clock').onclick=()=>$('timerOverlay').classList.remove('hidden');$('timerOverlay').onclick=e=>{if(e.target===$('timerOverlay'))$('timerOverlay').classList.add('hidden')};$('pause').onclick=async()=>{try{s.status=s.status==='active'?'paused':'active';await save();last=Date.now();$('timerOverlay').classList.add('hidden')}catch(e){say(e.message)}};$('end').onclick=async()=>{if(confirm('结束这次陪伴吗？'))try{await complete();back()}catch(_){}};$('collapse').onclick=()=>{$('chatZone').classList.add('collapsed');$('composer').classList.add('collapsed');$('expand').classList.remove('hidden')};$('expand').onclick=()=>{$('chatZone').classList.remove('collapsed');$('composer').classList.remove('collapsed');$('expand').classList.add('hidden')};
$('composer').onsubmit=async e=>{e.preventDefault();const input=$('input'),content=input.value.trim();if(!content)return;if(s.status!=='active')return say('请先开始');try{s=(await api('/api/companion/sessions/'+s.id+'/messages',{method:'POST',body:JSON.stringify({content})})).session;input.value='';render()}catch(x){say(x.message)}};$('ask').onclick=async()=>{if(s.status!=='active')return say('请先开始');try{$('ask').disabled=true;s=(await api('/api/companion/sessions/'+s.id+'/reply',{method:'POST'})).session;render()}catch(x){say(x.message)}finally{$('ask').disabled=false}};
function custom(sel,input){input.classList.toggle('hidden',sel.value!=='custom')}function pick(sel,input,def){return sel.value==='custom'?Math.round(Number(input.value)||0):Number(sel.value||def)}function setPick(sel,input,v){const o=[...sel.options].find(x=>Number(x.value)===Number(v));sel.value=o?o.value:'custom';input.value=o?'':v;custom(sel,input)}function validHex(value,fallback){const normalized=String(value||'').trim();return /^#[0-9a-f]{6}$/i.test(normalized)?normalized.toUpperCase():fallback}function syncColor(color,code){const v=validHex($(code).value,$(color).value);$(color).value=v;$(code).value=v}function vis(){$('intervalRow').classList.toggle('hidden',!$('auto').checked);$('rangeRow').classList.toggle('hidden',!(s.scene==='sleep'&&$('auto').checked))}function openSettings(){$('ambient').value=s.ambient||'rain';$('auto').checked=!!s.autoEnabled;setPick($('interval'),$('intervalCustom'),s.autoIntervalMinutes||5);setPick($('range'),$('rangeCustom'),s.autoUntilMinutes||30);const a=s.appearance||{};const colors=[['userBubble','#e9d8d8'],['taBubble','#ffffff'],['userText','#392e31'],['taText','#392e31']];colors.forEach(([name,fallback])=>{$(name).value=a[name]||fallback;$(name+'Code').value=$(name).value.toUpperCase()});$('opacity').value=Math.round((Number(a.opacity)||.88)*100);$('bubbleWidth').value=Number(a.bubbleWidth)||100;$('bubbleFontSize').value=Number(a.bubbleFontSize)||12;vis();$('sheet').classList.remove('hidden')}$('openSettings').onclick=openSettings;$('closeSettings').onclick=()=>$('sheet').classList.add('hidden');$('auto').onchange=vis;[['interval','intervalCustom'],['range','rangeCustom']].forEach(x=>$(x[0]).onchange=()=>custom($(x[0]),$(x[1])));[['userBubble','userBubbleCode'],['taBubble','taBubbleCode'],['userText','userTextCode'],['taText','taTextCode']].forEach(([color,code])=>{$(color).oninput=()=>$(code).value=$(color).value.toUpperCase();$(code).onchange=()=>syncColor(color,code)});$('clearWallpaper').onclick=()=>{$('wallpaper').value='';settings.wallpapers=settings.wallpapers||{};if(s.scene==='sleep')settings.wallpapers[key()]='';else delete settings.wallpapers[key()];say('保存后将恢复主题色')};$('saveSettings').onclick=async()=>{const saveButton=$('saveSettings');try{saveButton.disabled=true;saveButton.textContent='正在保存…';const f=$('wallpaper').files[0];settings.wallpapers=settings.wallpapers||{};if(f)settings.wallpapers[key()]=await fileData(f);settings=await api('/api/companion/settings',{method:'PUT',body:JSON.stringify({wallpapers:settings.wallpapers})});const interval=pick($('interval'),$('intervalCustom'),5),range=pick($('range'),$('rangeCustom'),30);if($('auto').checked&&interval<1)throw Error('请输入有效的回复间隔');if(s.scene==='sleep'&&$('auto').checked&&range<1)throw Error('请输入有效的主动关心范围');[['userBubble','userBubbleCode'],['taBubble','taBubbleCode'],['userText','userTextCode'],['taText','taTextCode']].forEach(x=>syncColor(x[0],x[1]));s=await api('/api/companion/sessions/'+s.id,{method:'PUT',body:JSON.stringify({ambient:$('ambient').value,autoEnabled:$('auto').checked,autoIntervalMinutes:interval,autoUntilMinutes:s.scene==='sleep'?range:0,appearance:{userBubble:$('userBubble').value,taBubble:$('taBubble').value,userText:$('userText').value,taText:$('taText').value,opacity:Number($('opacity').value)/100,bubbleWidth:Number($('bubbleWidth').value),bubbleFontSize:Number($('bubbleFontSize').value)}})});$('sheet').classList.add('hidden');render();say('设置已保存')}catch(e){say(e.message)}finally{saveButton.disabled=false;saveButton.textContent='保存设置'}};
async function load(){if(!id)return say('没有找到陪伴房间');try{settings=await api('/api/companion/settings');const d=await api('/api/companion/sessions');s=d.sessions.find(x=>x.id===id);if(!s)throw Error('陪伴房间不存在');if(s.status!=='ended')rememberRoute();render();setInterval(tick,1000);setInterval(refresh,15000)}catch(e){say(e.message)}}document.addEventListener('visibilitychange',()=>{if(!document.hidden){last=Date.now();refresh()}else if(s)save().catch(()=>{})});window.addEventListener('pagehide',()=>{if(s)save().catch(()=>{})});load()})();
</script></body></html>
