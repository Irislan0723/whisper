<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>钱包 · Iris and Rei</title><script src="init.js"></script><link rel="manifest" href="/manifest.json"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
body{background:var(--bg);color:var(--text)}.wallet{max-width:560px;margin:auto;padding:28px 18px calc(98px + env(safe-area-inset-bottom));box-sizing:border-box}.wallet-head{text-align:center;padding:18px 0 22px}.wallet-head h1{margin:0;font:400 35px/1.1 var(--font-d);letter-spacing:.04em}.wallet-head p{margin:9px 0 0;color:var(--text-light);font:400 12px var(--font-en);letter-spacing:.1em}.identity-tabs{display:grid;grid-template-columns:auto 1fr 1fr;gap:7px;align-items:center;padding:4px;border-radius:16px;background:var(--bg-secondary)}.identity-tabs>span{padding:0 7px;color:var(--text-light);font:13px var(--font-b);white-space:nowrap}.identity-tabs button{padding:10px 6px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text-mid);font:14px var(--font-b);cursor:pointer}.identity-tabs button.active{border-color:var(--accent-light);background:var(--bg-card);color:var(--text);box-shadow:var(--shadow-xs)}.summary{position:relative;margin-top:18px;padding:17px;border:1px solid var(--border);border-radius:var(--r-lg);background:#20ad68;color:#fff;box-shadow:0 7px 22px rgba(20,145,86,.2)}.summary-role{display:none;align-items:center;gap:7px;margin-bottom:13px}.summary-role.show{display:flex}.summary-role-avatar{display:grid;place-items:center;width:25px;height:25px;overflow:hidden;border-radius:50%;background:rgba(255,255,255,.2);font:12px var(--font-d)}.summary-role-avatar img{width:100%;height:100%;object-fit:cover}.summary-role-name{font:13px var(--font-b);flex:1}.role-switch{display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}.role-switch svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.role-menu{position:absolute;z-index:5;top:51px;left:14px;display:none;width:min(260px,calc(100vw - 70px));padding:7px;border:1px solid var(--border);border-radius:15px;background:var(--bg-card);box-shadow:var(--shadow-md)}.role-menu.open{display:grid;gap:2px}.role-choice{display:flex;align-items:center;gap:9px;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--text);font:13px var(--font-b);text-align:left;cursor:pointer}.role-choice.active{background:var(--accent-pale)}.role-choice i{display:grid;place-items:center;width:25px;height:25px;overflow:hidden;border-radius:50%;background:var(--bg-secondary);font:12px var(--font-d);font-style:normal}.role-choice img{width:100%;height:100%;object-fit:cover}.ledger-metrics{display:grid;grid-template-columns:1fr 1fr}.ledger-metric{display:grid;justify-items:center;gap:5px;padding:6px 8px}.ledger-metric+.ledger-metric{border-left:1px solid rgba(255,255,255,.24)}.ledger-metric svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.ledger-metric span{font:13px var(--font-b);color:rgba(255,255,255,.84)}.ledger-metric strong{font:400 28px/1 var(--font-d);white-space:nowrap}.section{margin-top:18px;padding:18px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-card);box-shadow:var(--shadow-sm)}.section h2{margin:0 0 12px;font:400 15px var(--font-en);letter-spacing:.11em}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border)}.row:first-child{border-top:0}.row strong{display:block;font:400 14px var(--font-b)}.row small{display:block;margin-top:4px;color:var(--text-light);font:11px var(--font-b)}.row b{font:400 17px var(--font-d);white-space:nowrap}.row b.in{color:#159f60}.row b.out{color:var(--accent)}.empty{padding:21px 0;color:var(--text-light);font:13px var(--font-b);text-align:center}.pager{display:flex;align-items:center;justify-content:center;gap:17px;margin-top:14px}.pager button{display:grid;place-items:center;width:31px;height:31px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--bg);color:var(--text);cursor:pointer}.pager button:disabled{opacity:.35}.pager svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pager span{min-width:54px;color:var(--text-light);font:12px var(--font-b);text-align:center}
</style></head><body>

<script>(()=>{const H={'x-api-key':'iris-memory-2024'},$=id=>document.getElementById(id),PAGE=5;let roles=[],transfers=[],owner='iris',roleId='',page=0;const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async p=>{const r=await fetch(p,{headers:H}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'加载失败');return d};const money=x=>'¥'+Number(x||0).toFixed(2),date=x=>new Date(x).toLocaleDateString('zh-CN',{year:'numeric',month:'numeric',day:'numeric'}),avatar=r=>r?.avatar?'<img src="'+esc(r.avatar)+'" alt="">':esc((r?.name||'T')[0]);function selected(){return transfers.filter(t=>t.transfer?.status==='received'&&(owner==='iris'||t.transfer?.roleId===roleId))}function renderRoles(){const a=roles.find(r=>r.id===roleId);$('summaryRole').classList.toggle('show',owner==='ta');$('summaryAvatar').innerHTML=avatar(a);$('summaryName').textContent=a?.name||'选择角色';$('roles').innerHTML=roles.map(r=>'<button class="role-choice '+(r.id===roleId?'active':'')+'" data-role="'+esc(r.id)+'"><i>'+avatar(r)+'</i>'+esc(r.name)+'</button>').join('');$('roles').querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{roleId=b.dataset.role;page=0;$('roles').classList.remove('open');renderRoles();render()})}function render(){const l=selected(),side=owner==='iris'?'iris':'ta',income=l.filter(t=>t.transfer.from!==side).reduce((s,t)=>s+Number(t.transfer.amount||0),0),expense=l.filter(t=>t.transfer.from===side).reduce((s,t)=>s+Number(t.transfer.amount||0),0);$('income').textContent=money(income);$('expense').textContent=money(expense);const pages=Math.max(1,Math.ceil(l.length/PAGE));page=Math.min(page,pages-1);const v=l.slice(page*PAGE,page*PAGE+PAGE);$('rows').innerHTML=v.length?v.map(t=>{const x=t.transfer,out=x.from===side;return '<div class="row"><div><strong>'+ (out?'我转出':'我收款')+'</strong><small>'+esc(x.note||'虚拟转账')+' · '+date(t.createdAt)+'</small></div><b class="'+(out?'out':'in')+'">'+(out?'-':'+')+money(x.amount)+'</b></div>'}).join(''):'<div class="empty">还没有已完成的转账记录</div>';$('pager').hidden=l.length<=PAGE;$('pageLabel').textContent=(page+1)+' / '+pages;$('newer').disabled=page===0;$('older').disabled=page>=pages-1}async function init(){const n=localStorage.getItem('iris_avatar_name1')||'Iris',im=localStorage.getItem('iris_avatar_img1');$('avatar').innerHTML=im?'<img src="'+esc(im)+'" alt="">':'<span class="top-bar-avatar-initial">'+esc(n[0])+'</span>';$('topTitle').textContent=localStorage.getItem('iris_topbar_title')||(n+'的小窝');try{const [r,w]=await Promise.all([api('/api/chat/roles'),api('/api/chat/wallet')]);roles=r.roles||[];transfers=w.transfers||[];roleId=roles[0]?.id||'';renderRoles();render()}catch(e){$('rows').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{owner=b.dataset.owner;page=0;document.querySelectorAll('[data-owner]').forEach(x=>x.classList.toggle('active',x===b));$('roles').classList.remove('open');renderRoles();render()});$('roleSwitch').onclick=()=>{$('roles').classList.toggle('open')};$('newer').onclick=()=>{page--;render()};$('older').onclick=()=>{page++;render()};init()})()</script></body></html>
