<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>拾月日历 · irisandclaude</title>
<script src="init.js"></script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ========== 拾月日历 v2 ========== */

/* ---- Tab bar ---- */
.cal-tabs{display:flex;padding:3px;background:var(--bg-card);border-radius:999px;margin-bottom:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.cal-tab{flex:1;border:none;background:transparent;padding:9px 0;font-family:var(--font-cn);font-size:13px;color:var(--text-mid);border-radius:999px;cursor:pointer;transition:all .22s;letter-spacing:.04em;font-weight:400}
.cal-tab.active{background:var(--accent);color:var(--accent-contrast);font-weight:600;box-shadow:0 2px 8px rgba(var(--shadow-color),.18)}

/* ---- Month nav ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px}
.cal-nav-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-mid);transition:all .18s;flex-shrink:0}
@media(hover:hover)and(pointer:fine){.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent)}}
.cal-month-center{text-align:center;cursor:pointer;padding:4px 14px;border-radius:var(--r-sm);transition:background .18s}
@media(hover:hover)and(pointer:fine){.cal-month-center:hover{background:var(--accent-pale)}}
.cal-year{font-size:12px;color:var(--text-light);letter-spacing:.06em}
.cal-month-text{font-family:var(--font-en);font-size:20px;font-weight:400;color:var(--text);letter-spacing:.04em}

/* ---- Week header ---- */
.cal-week-header{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.wh{text-align:center;font-size:11px;color:var(--text-light);padding:5px 0;letter-spacing:.06em}
.wh-weekend{color:var(--accent)}

/* ---- Calendar grid ---- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r-sm);cursor:pointer;transition:all .15s;gap:2px;position:relative;min-height:62px;border:1.5px solid transparent}
.cal-cell.empty{cursor:default}
@media(hover:hover)and(pointer:fine){.cal-cell:not(.empty):hover{background:var(--bg-secondary)}}
.cal-cell.selected{background:var(--accent-pale);border-color:var(--accent)}
.cal-cell.anniversary{background:linear-gradient(135deg,rgba(242,170,186,.12),rgba(173,142,142,.08))}
.cal-cell.anniversary::after{content:'♡';position:absolute;top:1px;right:3px;font-size:8px;color:var(--accent);opacity:.6}
.day-num{font-size:12px;color:var(--text);line-height:1;font-family:var(--font-en)}
.cal-cell.other-month .day-num{color:var(--text-light);opacity:.35}
.cal-cell.today .day-num{background:var(--accent);color:var(--accent-contrast);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}

/* ---- Mood indicators (images) ---- */
.mood-dots{display:flex;align-items:center;gap:3px;min-height:14px}
.mood-img{width:14px;height:14px;object-fit:contain}
.mood-placeholder{width:12px;height:12px;flex-shrink:0;background:var(--bg-secondary)}
.mood-placeholder.circle{border-radius:50%}
.mood-placeholder.square{border-radius:2px}

/* ---- Period tab cells (fixed Morandi colors, theme-independent) ---- */
.tab-period .cal-cell{min-height:48px}
.cal-cell.phase-menstrual{background:#F0D0D0;border-left:2.5px solid #D4A0A0}
.cal-cell.phase-predicted{border:1.5px dashed #D4A0A0;background:transparent}
.cal-cell.phase-ovulation{background:#D0E0F0}
.cal-cell.phase-follicular{background:#D0E8D4}
.cal-cell.phase-luteal{background:#E8DCC8}
.phase-dot{width:6px;height:6px;border-radius:50%;min-height:6px}
.phase-dot.menstrual{background:#D4A0A0}
.phase-dot.predicted{width:5px;height:5px;border:1.5px dashed #D4A0A0;background:transparent}
.phase-dot.ovulation{background:#7BA8CC}
.phase-dot.follicular{background:#8BBF90}
.phase-dot.luteal{background:#C8B080}

/* ---- Schedule tab cells ---- */
.tab-schedule .cal-cell{min-height:56px;gap:1px}
.lunar-text{font-size:9px;color:var(--text-light);line-height:1;margin-top:1px}
.lunar-text.month-start{color:var(--accent);font-weight:600}
.course-dots{display:flex;gap:2px;min-height:6px;flex-wrap:wrap;justify-content:center}
.course-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ---- Day schedule card ---- */
.day-schedule{background:var(--bg-card);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-xs);margin-bottom:14px}
.day-schedule-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day-schedule-title{font-size:14px;font-weight:600;color:var(--text)}
.day-schedule-date{font-size:11px;color:var(--text-light)}
.schedule-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.schedule-item:last-child{border-bottom:none}
.schedule-color-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch}
.schedule-info{flex:1;min-width:0}
.schedule-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.schedule-detail{font-size:11px;color:var(--text-mid)}
.schedule-empty{font-size:13px;color:var(--text-light);padding:8px 0;text-align:center}

/* ---- Legend ---- */
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--bg-card);border-radius:var(--r-md);box-shadow:var(--shadow-xs);margin-bottom:12px;align-items:center}
.legend-dot{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-mid)}
.legend-icon{width:10px;height:10px;flex-shrink:0}
.legend-icon.circle{border-radius:50%}
.legend-icon.square{border-radius:2px}
.legend-icon.dashed{border:1.5px dashed #D4A0A0;background:transparent!important;width:8px;height:8px}

/* ---- CTA button ---- */
.cal-cta{display:block;width:100%;padding:13px 0;border:none;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--font-cn);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.06em;transition:all .18s;box-shadow:0 2px 10px rgba(var(--shadow-color),.16);margin-bottom:14px}
@media(hover:hover)and(pointer:fine){.cal-cta:hover{box-shadow:0 4px 16px rgba(var(--shadow-color),.24);transform:translateY(-1px)}}

/* ---- My timetable button ---- */
.schedule-btns{display:flex;gap:8px;margin-bottom:14px}
.timetable-btn{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;padding:10px 0;border:1.5px solid var(--accent);border-radius:999px;background:transparent;color:var(--accent);font-family:var(--font-cn);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s}
@media(hover:hover)and(pointer:fine){.timetable-btn:hover{background:var(--accent-pale)}}

/* ---- Stats card ---- */
.stats-card{background:var(--bg-card);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-xs);margin-bottom:14px}
.stats-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.stats-title-text{font-size:14px;font-weight:600;color:var(--text)}
.stats-title-count{font-size:12px;color:var(--text-light)}
.stats-empty{font-size:13px;color:var(--text-light);padding:8px 0}
.stats-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.stats-bar-row:last-child{margin-bottom:0}
.stats-bar-img{width:18px;height:18px;object-fit:contain;flex-shrink:0}
.stats-bar-label{font-size:11px;color:var(--text-mid);width:28px;flex-shrink:0}
.stats-bar-track{flex:1;height:7px;border-radius:999px;background:var(--bg-secondary);overflow:hidden}
.stats-bar-fill{height:100%;border-radius:999px;transition:width .4s ease}
.stats-bar-count{font-size:11px;color:var(--text-light);width:18px;text-align:right;flex-shrink:0}
.stats-divider{height:1px;background:var(--border);margin:12px 0}

/* ---- Period card ---- */
.period-card{background:var(--bg-card);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-xs);margin-bottom:14px}
.period-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.period-header-title{font-size:15px;font-weight:600;color:var(--text)}
.period-edit-btn{border:none;background:var(--accent-pale);color:var(--accent);font-family:var(--font-cn);font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;transition:all .18s}
.period-nums{display:flex;gap:14px;margin-bottom:14px}
.period-num-block{flex:1;text-align:center}
.period-num-value{font-family:var(--font-en);font-size:28px;font-weight:400;line-height:1.1}
.period-num-label{font-size:11px;color:var(--text-light);margin-top:2px}
.period-nums-divider{width:1px;background:var(--border);align-self:stretch}
.period-actions{display:flex;gap:8px}
.period-action-btn{flex:1;border:none;padding:10px 0;border-radius:999px;font-family:var(--font-cn);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.03em}
.period-action-start{background:var(--accent-pale);color:var(--accent)}
.period-action-end{background:var(--bg-secondary);color:var(--text-mid)}
.phase-status{font-size:12px;color:#9A5555;text-align:center;margin-bottom:10px;padding:6px;background:#F0D0D0;border-radius:var(--r-sm)}

/* ---- Bottom sheet ---- */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .24s}
.sheet-overlay.open{opacity:1;pointer-events:auto}
.sheet-card{width:100%;max-width:440px;max-height:85vh;overflow-y:auto;background:var(--bg-card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 18px max(18px,env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,.24,1.02)}
.sheet-overlay.open .sheet-card{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bg-secondary);margin:0 auto 16px}
.sheet-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-title{font-size:17px;font-weight:600;color:var(--text)}
.sheet-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg-secondary);color:var(--text-mid);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ---- Detail popup ---- */
.detail-sub{font-size:12px;color:var(--text-light);margin-bottom:8px}
.detail-mood-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.detail-mood-img{width:32px;height:32px;object-fit:contain;flex-shrink:0}
.detail-mood-text{font-size:14px;color:var(--text)}
.detail-note{font-size:12px;color:var(--text-mid);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;line-height:1.6;white-space:pre-wrap}
.detail-note-user{background:rgba(var(--shadow-color),.06)}
.detail-note-ai{background:rgba(143,167,175,.1)}
.detail-empty{font-size:13px;color:var(--text-light);font-style:italic;padding:4px 0}
.detail-phase-tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;margin-top:6px}
.detail-actions{display:flex;gap:6px;margin-top:14px}
.detail-btn{flex:1;border:none;padding:10px 0;border-radius:999px;font-family:var(--font-cn);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s}
.detail-btn-primary{background:var(--accent);color:#fff}
.detail-btn-danger{background:var(--accent-pale);color:var(--accent)}
.detail-btn-ghost{background:var(--bg-secondary);color:var(--text-mid)}

/* ---- Record mood sheet ---- */
.record-date{font-size:12px;color:var(--text-light);margin-bottom:12px}
.who-tabs{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--bg);margin-bottom:12px}
.who-tab{flex:1;border:none;background:transparent;color:var(--text-mid);padding:7px 0;font-family:var(--font-cn);font-size:13px;border-radius:999px;cursor:pointer;transition:all .18s}
.who-tab.active{background:var(--bg-card);color:var(--text);box-shadow:var(--shadow-xs);font-weight:600}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
.mood-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:var(--r-sm);border:2px solid transparent;cursor:pointer;transition:all .18s}
@media(hover:hover)and(pointer:fine){.mood-cell:hover{background:var(--bg)}}
.mood-cell.selected{background:var(--accent-pale);border-color:var(--accent)}
.mood-cell-img{width:36px;height:36px;object-fit:contain}
.mood-cell-label{font-size:10px;color:var(--text-mid)}
.mood-cell.selected .mood-cell-label{color:var(--accent);font-weight:600}
.record-note{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--font-cn);font-size:13px;color:var(--text);background:var(--bg);resize:none;outline:none;transition:border-color .18s;margin-bottom:12px;box-sizing:border-box}
.record-note:focus{border-color:var(--accent)}
.record-note::placeholder{color:var(--text-light)}
.sheet-btn{width:100%;border:none;padding:11px 0;border-radius:999px;font-family:var(--font-cn);font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;margin-bottom:5px}
.sheet-btn-primary{background:var(--accent);color:#fff}
.sheet-btn-disabled{background:var(--text-light);color:#fff;cursor:default}
.sheet-btn-ghost{background:transparent;color:var(--text-mid);font-weight:400;font-size:13px}

/* ---- Picker ---- */
.picker-year-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.picker-year-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg-secondary);color:var(--text-mid);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.picker-year-text{font-size:18px;font-weight:600;color:var(--text)}
.picker-month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}
.picker-month-cell{padding:10px 0;border-radius:var(--r-sm);border:none;background:transparent;font-family:var(--font-cn);font-size:13px;color:var(--text);cursor:pointer;text-align:center;transition:all .18s}
.picker-month-cell.current{background:var(--accent);color:#fff;font-weight:600}
.picker-month-cell.today-month{background:var(--accent-pale);color:var(--accent)}
.picker-actions{display:flex;gap:8px}
.picker-btn{flex:1;border:none;padding:10px 0;border-radius:999px;font-family:var(--font-cn);font-size:13px;cursor:pointer;transition:all .18s}
.picker-btn-today{background:var(--accent-pale);color:var(--accent);font-weight:600}
.picker-btn-cancel{background:var(--bg-secondary);color:var(--text-mid)}

/* ---- Settings ---- */
.setting-label{font-size:13px;color:var(--text-mid);margin-bottom:6px}
.setting-stepper{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:16px}
.stepper-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg-secondary);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper-value{font-family:var(--font-en);font-size:32px;font-weight:400;min-width:44px;text-align:center}

/* ---- Course form ---- */
.form-row{margin-bottom:12px}
.form-label{font-size:12px;color:var(--text-mid);margin-bottom:4px;display:block}
.form-input{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;font-family:var(--font-cn);font-size:13px;color:var(--text);background:var(--bg);outline:none;box-sizing:border-box}
.form-input:focus{border-color:var(--accent)}
.form-row-inline{display:flex;gap:8px}
.form-row-inline .form-row{flex:1;margin-bottom:0}
.form-select{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;font-family:var(--font-cn);font-size:13px;color:var(--text);background:var(--bg);outline:none;appearance:none;box-sizing:border-box}
.course-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.course-list-item:last-child{border-bottom:none}
.course-list-color{width:8px;height:36px;border-radius:4px;flex-shrink:0}
.course-list-info{flex:1;min-width:0}
.course-list-name{font-size:13px;font-weight:600;color:var(--text)}
.course-list-detail{font-size:11px;color:var(--text-mid)}
.course-list-del{border:none;background:var(--accent-pale);color:var(--accent);font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer;flex-shrink:0}
.semester-setting{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 12px;background:var(--bg);border-radius:var(--r-sm)}
.semester-label{font-size:12px;color:var(--text-mid);flex-shrink:0}
.semester-input{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:var(--font-cn);font-size:12px;color:var(--text);background:var(--bg-card);outline:none;box-sizing:border-box}

/* ---- Extra ---- */
.extra-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-mid);background:var(--bg);padding:5px 10px;border-radius:var(--r-sm);margin-top:6px;line-height:1.5;white-space:pre-wrap}

/* ---- Skeleton ---- */
.cal-skeleton-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-skeleton{min-height:62px;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--bg-card),var(--bg-secondary),var(--bg-card));background-size:220% 100%;animation:shimmer 1.3s ease-in-out infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ---- Calendar card wrapper ---- */
.cal-card{background:var(--bg-card);border-radius:var(--r-lg);padding:14px 10px 10px;box-shadow:var(--shadow-sm);margin-bottom:14px}

/* ---- Period detail form ---- */
.pd-section{margin-bottom:14px}
.pd-label{font-size:12px;color:var(--text-mid);margin-bottom:6px;font-weight:600}
.pd-chips{display:flex;gap:6px;flex-wrap:wrap}
.pd-chip{padding:6px 14px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--text-mid);font-family:var(--font-cn);font-size:12px;cursor:pointer;transition:all .18s}
@media(hover:hover)and(pointer:fine){.pd-chip:hover{border-color:var(--accent-mid);color:var(--accent)}}
.pd-chip.selected{background:var(--accent-pale);border-color:var(--accent);color:var(--accent);font-weight:600}
.pd-summary{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.pd-tag{font-size:11px;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:3px}

/* ---- Responsive ---- */
@media(max-width:480px){
  .cal-cell{min-height:54px}
  .tab-period .cal-cell{min-height:42px}
  .tab-schedule .cal-cell{min-height:50px}
  .day-num{font-size:11px}
  .cal-cell.today .day-num{width:20px;height:20px;font-size:10px}
  .mood-img{width:12px;height:12px}
  .mood-placeholder{width:10px;height:10px}
  .lunar-text{font-size:8px}
  .cal-month-text{font-size:18px}
  .mood-grid{gap:3px}
  .mood-cell{padding:6px 1px}
  .mood-cell-img{width:30px;height:30px}
  .sheet-card{padding:18px 14px max(14px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<!-- Top Bar -->
<header class="top-bar">
  <div class="top-bar-left">
    <div class="top-bar-avatar" id="topBarAvatar"></div>
    <span class="top-bar-title" id="topBarTitle"></span>
  </div>
  <a href="index.html" class="top-bar-right top-bar-home" aria-label="返回首页" title="返回首页" style="display:grid;place-items:center;width:34px;height:34px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/></svg></a>
</header>

<!-- Bottom Dock -->

  return{text:LUNAR_DAYS[l.day-1],isMonthStart:false}
}

function normalizeRec(r){
  if(!r||!r.date)return null;
  var t=r.type||'mood';
  return{date:r.date,type:t,who:t==='mood'?(r.who||'iris'):(r.who||''),mood:r.mood||'',note:r.note||r.text||'',phase:r.phase||'',predicted:!!r.predicted}
}
function recKey(r){return r.type==='mood'?r.date+'|mood|'+(r.who||'iris'):r.date+'|'+(r.type||'mood')+'|'+(r.phase||'')}
function uniqueRecs(list){
  var map={};list.forEach(function(r){var n=normalizeRec(r);if(n)map[recKey(n)]=n});
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.date.localeCompare(b.date)})
}
function readLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')}catch(e){return[]}}
function writeLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(records))}
function upsertLocal(rec){
  var n=normalizeRec(rec);if(!n)return;var k=recKey(n);
  var idx=-1;for(var i=0;i<records.length;i++){if(recKey(records[i])===k){idx=i;break}}
  if(idx>=0)records[idx]=n;else records.push(n);
  records=uniqueRecs(records);writeLocal();
}
function getMoodRec(date,who){return records.find(function(r){return r.date===date&&r.type==='mood'&&r.who===who})}
function getDayRecs(date){return records.filter(function(r){return r.date===date})}

/* ===== Period Computation ===== */
function getPeriodRanges(){
  var starts=records.filter(function(r){return r.type==='period'&&r.phase==='start'&&!r.predicted}).sort(function(a,b){return a.date.localeCompare(b.date)});
  var ends=records.filter(function(r){return r.type==='period'&&r.phase==='end'}).sort(function(a,b){return a.date.localeCompare(b.date)});
  var ranges=[];
  starts.forEach(function(s){var e=ends.find(function(e){return e.date>=s.date});ranges.push({start:s.date,end:e?e.date:null})});
  return ranges;
}
function computePhaseInfo(year,month){
  var first=new Date(year,month,1),last=new Date(year,month+1,0);
  var ranges=getPeriodRanges();
  var actual=[],predicted=[],ovulation=[],follicular=[],luteal=[];
  var cl=settings.cycle_length,pl=settings.period_length;
  var ovDay=cl-14;

  /* Mark actual menstrual days from all ranges */
  ranges.forEach(function(rng){
    var s=new Date(rng.start+'T00:00:00');
    var e=rng.end?new Date(rng.end+'T00:00:00'):new Date(s.getTime()+(pl-1)*864e5);
    for(var d=new Date(s);d<=e&&d<=last;d.setDate(d.getDate()+1)){if(d>=first)actual.push(d.getDate())}
  });

  /* Compute phases: use last range as reference.
     i=0 → current cycle (always shown: follicular / ovulation / luteal after menstruation).
     i≥1 → future predicted cycles (only when range is completed). */
  if(ranges.length>0){
    var lastRng=ranges[ranges.length-1];
    var ls=new Date(lastRng.start+'T00:00:00');
    var isComplete=!!lastRng.end;
    var maxI=isComplete?6:0;
    for(var i=0;i<=maxI;i++){
      var cycleStart=new Date(ls.getTime()+cl*i*864e5);
      for(var dd=0;dd<cl;dd++){
        var cur=new Date(cycleStart.getTime()+dd*864e5);
        if(cur<first||cur>last)continue;
        var dn=cur.getDate();
        if(dd<pl){
          /* i=0 menstrual days are already in actual; i>0 are predictions */
          if(i>0&&actual.indexOf(dn)===-1&&predicted.indexOf(dn)===-1)predicted.push(dn);
        }else if(dd>=ovDay-2&&dd<=ovDay+2){
          if(ovulation.indexOf(dn)===-1)ovulation.push(dn);
        }else if(dd>=pl&&dd<ovDay-2){
          if(follicular.indexOf(dn)===-1)follicular.push(dn);
        }else if(dd>ovDay+2){
          if(luteal.indexOf(dn)===-1)luteal.push(dn);
        }
      }
    }
  }
  return{actual:actual,predicted:predicted,ovulation:ovulation,follicular:follicular,luteal:luteal}
}
function getCurrentPhase(){
  var ranges=getPeriodRanges();
  if(ranges.length===0)return null;
  var ls=new Date(ranges[ranges.length-1].start+'T00:00:00');
  var today=new Date(TY,TM,TD);
  var diff=Math.floor((today-ls)/864e5);
  if(diff<0)return null;
  var cl=settings.cycle_length,pl=settings.period_length,ovDay=cl-14;
  var dayInCycle=((diff%cl)+cl)%cl;
  if(dayInCycle<pl)return'menstrual';
  if(dayInCycle>=ovDay-2&&dayInCycle<=ovDay+2)return'ovulation';
  if(dayInCycle>=pl&&dayInCycle<ovDay-2)return'follicular';
  return'luteal';
}

function getSemesterWeek(dateStr){
  var ss=new Date(courseData.semester_start+'T00:00:00');
  var d=new Date(dateStr+'T00:00:00');
  var diff=Math.floor((d-ss)/864e5);
  return diff>=0?Math.floor(diff/7)+1:-1;
}
function getCoursesForDate(dateStr){
  var d=new Date(dateStr+'T00:00:00');
  var dow=d.getDay();dow=dow===0?7:dow;
  var week=getSemesterWeek(dateStr);
  if(week<1)return[];
  return courseData.courses.filter(function(c){
    return c.day===dow&&week>=c.weekStart&&week<=c.weekEnd;
  });
}

          '<div class="schedule-detail">'+(timeStr?timeStr:'全天')+(e.location?' · '+escHtml(e.location):'')+(e.note?' · '+escHtml(e.note):'')+'</div></div>'+
          '<button class="course-list-del" onclick="deleteEvent(\''+e.id+'\')">删</button></div>';
      });
    }
    if(dayCourses.length===0&&dayEvents.length===0){
      scheduleHtml+='<div class="schedule-empty">这天没有日程安排</div>';
    }
    scheduleHtml+='</div>';
    sec.innerHTML=scheduleHtml;
    $('openTimetable').addEventListener('click',function(){renderCourseList();openSheet('courseListSheet')});
    $('addEventBtn').addEventListener('click',function(){openEventForm(selDate)});
  }
}

function renderStats(){
  var sec=$('statsSection');if(!sec)return;
  var mstr=ms(curYear,curMonth);
  var uc={},ac={},ut=0,at=0;
  records.forEach(function(r){
    if(r.type!=='mood'||r.date.indexOf(mstr)!==0)return;
    if(r.who==='iris'){uc[r.mood]=(uc[r.mood]||0)+1;ut++}
    if(r.who==='claude'){ac[r.mood]=(ac[r.mood]||0)+1;at++}
  });
  if(ut===0&&at===0){sec.innerHTML='<div class="stats-card"><div class="stats-empty">本月还没有心情记录</div></div>';return}
  var html='<div class="stats-card">';
  if(ut>0){html+='<div class="stats-title"><span class="stats-title-text">'+name1+' 的心情</span><span class="stats-title-count">'+ut+' 天</span></div>'+buildBars(uc,ut,'uc')}
  if(ut>0&&at>0)html+='<div class="stats-divider"></div>';
  if(at>0){html+='<div class="stats-title"><span class="stats-title-text">'+name2+' 的心情</span><span class="stats-title-count">'+at+' 天</span></div>'+buildBars(ac,at,'us')}
  sec.innerHTML=html+'</div>';
}
function buildBars(counts,total,shape){
  var entries=Object.keys(counts).map(function(k){return[k,counts[k]]}).sort(function(a,b){return b[1]-a[1]});
  return entries.map(function(e){
    var m=MOOD_META[e[0]]||{label:e[0],color:'#CCC',uc:'',us:''};
    var pct=Math.round(e[1]/total*100);
    var imgUrl=shape==='uc'?m.uc:m.us;
    return '<div class="stats-bar-row"><img class="stats-bar-img" src="'+imgUrl+'" alt="'+m.label+'">'+
      '<span class="stats-bar-label">'+m.label+'</span>'+
      '<div class="stats-bar-track"><div class="stats-bar-fill" style="width:'+pct+'%;background:'+m.color+'"></div></div>'+
      '<span class="stats-bar-count">'+e[1]+'</span></div>';
  }).join('');
}

/* ===== Day Detail ===== */
function showDayDetail(day){
  var dstr=ms(curYear,curMonth)+'-'+pad2(day);
  var dayRecs=getDayRecs(dstr);
  var im=getMoodRec(dstr,'iris'),cm=getMoodRec(dstr,'claude');
  var pi=computePhaseInfo(curYear,curMonth);
  var sickRecs=dayRecs.filter(function(r){return r.type==='sick'});
  var pinRecs=dayRecs.filter(function(r){return r.type==='pin'});

  $('detailTitle').textContent=curYear+'.'+pad2(curMonth+1)+'.'+pad2(day);
  var body='';

  // Mood section
  if(im||cm){
    body+='<div class="detail-sub">双人心情</div>';
    if(im){var m1=MOOD_META[im.mood]||{label:im.mood,uc:'',color:'#CCC'};
      body+='<div class="detail-mood-row"><img class="detail-mood-img" src="'+m1.uc+'" alt=""><span class="detail-mood-text">'+name1+'：'+m1.label+'</span></div>';
      if(im.note)body+='<div class="detail-note detail-note-user">'+escHtml(im.note)+'</div>';}
    if(cm){var m2=MOOD_META[cm.mood]||{label:cm.mood,us:'',color:'#CCC'};
      body+='<div class="detail-mood-row"><img class="detail-mood-img" src="'+m2.us+'" alt=""><span class="detail-mood-text">'+name2+'：'+m2.label+'</span></div>';
      if(cm.note)body+='<div class="detail-note detail-note-ai">'+escHtml(cm.note)+'</div>';}
  }else if(curTab==='mood'){
    body+='<div class="detail-empty">这天还没有心情记录</div>';
  }

  // Period phase info
  if(pi.actual.indexOf(day)!==-1)body+='<div class="detail-phase-tag" style="background:#F0D0D0;color:#9A5555">经期中</div>';
  if(pi.predicted.indexOf(day)!==-1)body+='<div class="detail-phase-tag" style="border:1.5px dashed #D4A0A0;color:#B07070">预测经期</div>';
  if(pi.ovulation.indexOf(day)!==-1)body+='<div class="detail-phase-tag" style="background:#D0E0F0;color:#5577AA">排卵期</div>';
  if(pi.follicular.indexOf(day)!==-1)body+='<div class="detail-phase-tag" style="background:#D0E8D4;color:#558866">卵泡期</div>';
  if(pi.luteal.indexOf(day)!==-1)body+='<div class="detail-phase-tag" style="background:#E8DCC8;color:#887755">黄体期</div>';

  // Period detail summary
  var pd=getPeriodDetail(dstr);
  if(pd){
    body+='<div class="pd-summary" style="margin-top:8px">';
    if(pd.flow)body+='<span class="pd-tag" style="background:#F0D0D0;color:#9A5555">'+FLOW_LABELS[pd.flow]+'</span>';
    if(pd.color)body+='<span class="pd-tag" style="background:#F0D0D0;color:#9A5555">'+COLOR_LABELS[pd.color]+'</span>';
    if(pd.pain)body+='<span class="pd-tag" style="background:#E8DCC8;color:#887755">疼痛:'+PAIN_LABELS[pd.pain]+'</span>';
    if(pd.symptoms&&pd.symptoms.length>0)pd.symptoms.forEach(function(s){body+='<span class="pd-tag" style="background:#D0E0F0;color:#5577AA">'+SYMPTOM_LABELS[s]+'</span>'});
    body+='</div>';
    if(pd.note)body+='<div class="detail-note detail-note-user" style="margin-top:4px">'+escHtml(pd.note)+'</div>';
  }

  // Schedule info
  if(curTab==='schedule'){
    var courses=getCoursesForDate(dstr);
    var dayEvts=getEventsForDate(dstr);
    if(courses.length>0){
      body+='<div class="detail-sub" style="margin-top:10px">课程安排</div>';
      courses.sort(function(a,b){return a.startP-b.startP});
      courses.forEach(function(c){
        body+='<div class="schedule-item"><div class="schedule-color-bar" style="background:'+COURSE_COLORS[c.color||0]+'"></div>'+
          '<div class="schedule-info"><div class="schedule-name">'+escHtml(c.name)+'</div>'+
          '<div class="schedule-detail">第'+c.startP+'-'+c.endP+'节'+(c.location?' · '+escHtml(c.location):'')+(c.teacher?' · '+escHtml(c.teacher):'')+'</div></div></div>';
      });
    }
    if(dayEvts.length>0){
      body+='<div class="detail-sub" style="margin-top:10px">日程</div>';
      dayEvts.forEach(function(e){
        var timeStr=e.timeStart?(e.timeStart+(e.timeEnd?' - '+e.timeEnd:'')):'全天';
        body+='<div class="schedule-item"><div class="schedule-color-bar" style="background:'+COURSE_COLORS[e.color||0]+'"></div>'+
          '<div class="schedule-info"><div class="schedule-name">'+escHtml(e.name)+'</div>'+
          '<div class="schedule-detail">'+timeStr+(e.location?' · '+escHtml(e.location):'')+(e.note?' · '+escHtml(e.note):'')+'</div></div></div>';
      });
    }
  }

  // Backward compat: sick/pin
  if(sickRecs.length||pinRecs.length){
    sickRecs.forEach(function(r){body+='<div class="extra-tag">🤒 '+escHtml(r.note||'生病记录')+'</div>'});
    pinRecs.forEach(function(r){body+='<div class="extra-tag">📌 '+escHtml(r.note||'重要备注')+'</div>'});
  }
  if(curMonth===ANN_MONTH&&day===ANN_DAY)body+='<div class="extra-tag" style="margin-top:6px">♡ 纪念日</div>';

  $('detailBody').innerHTML=body;

  // Actions
  var act='';
  if(curTab==='mood'){
    act+='<button class="detail-btn detail-btn-primary" id="dRecord">记录心情</button>';
    if(im||cm)act+='<button class="detail-btn detail-btn-danger" id="dDelete">删除心情</button>';
    act+='<button class="detail-btn detail-btn-ghost" onclick="closeSheet(\'detailSheet\')">关闭</button>';
  }else if(curTab==='period'){
    act+='<button class="detail-btn detail-btn-primary" id="dPStart">标记开始</button>';
    act+='<button class="detail-btn detail-btn-ghost" id="dPEnd">标记结束</button>';
    act+='<button class="detail-btn detail-btn-primary" id="dPDetail" style="background:var(--accent-mid)">记录详情</button>';
    if(pi.actual.indexOf(day)!==-1)act+='<button class="detail-btn detail-btn-danger" id="dPDel">删除标记</button>';
    act+='<button class="detail-btn detail-btn-ghost" onclick="closeSheet(\'detailSheet\')">关闭</button>';
  }else{
    act+='<button class="detail-btn detail-btn-primary" id="dAddEvent">添加日程</button>';
    act+='<button class="detail-btn detail-btn-ghost" onclick="closeSheet(\'detailSheet\')">关闭</button>';
  }
  $('detailActions').innerHTML=act;

  var rb=$('dRecord');if(rb)rb.addEventListener('click',function(){closeSheet('detailSheet');openRecordSheet(day)});
  var db=$('dDelete');if(db)db.addEventListener('click',function(){deleteMood(dstr)});
  var ps=$('dPStart');if(ps)ps.addEventListener('click',function(){savePeriodMark(dstr,'start');closeSheet('detailSheet')});
  var pe=$('dPEnd');if(pe)pe.addEventListener('click',function(){savePeriodMark(dstr,'end');closeSheet('detailSheet')});
  var pdt=$('dPDetail');if(pdt)pdt.addEventListener('click',function(){closeSheet('detailSheet');openPeriodDetail(dstr)});
  var pdd=$('dPDel');if(pdd)pdd.addEventListener('click',function(){deletePeriod(dstr)});
  var ae=$('dAddEvent');if(ae)ae.addEventListener('click',function(){closeSheet('detailSheet');openEventForm(dstr)});

  openSheet('detailSheet');
}

/* ===== Record Mood Sheet ===== */
function openRecordSheet(day){
  selDay=day||TD;selMood='';
  var dstr=ms(curYear,curMonth)+'-'+pad2(selDay);
  $('recordDate').textContent=curYear+'年'+(curMonth+1)+'月'+selDay+'日';

  // Who tabs
  $('whoTabs').innerHTML='<button class="who-tab'+(selWho==='iris'?' active':'')+'" data-who="iris">'+name1+'</button>'+
    '<button class="who-tab'+(selWho==='claude'?' active':'')+'" data-who="claude">'+name2+'</button>';

  // Mood grid with images
  var grid=$('moodGrid');grid.innerHTML='';
  MOOD_TYPES.forEach(function(m){
    var meta=MOOD_META[m];
    var cell=document.createElement('div');cell.className='mood-cell';cell.dataset.mood=m;
    cell.innerHTML='<img class="mood-cell-img" src="'+(selWho==='iris'?meta.uc:meta.us)+'" alt="'+meta.label+'"><span class="mood-cell-label">'+meta.label+'</span>';
    cell.addEventListener('click',function(){
      grid.querySelectorAll('.mood-cell').forEach(function(c){c.classList.remove('selected')});
      cell.classList.add('selected');selMood=m;
      $('recordSave').className='sheet-btn sheet-btn-primary';
    });
    grid.appendChild(cell);
  });

  // Check existing
  var existing=getMoodRec(dstr,selWho);
  if(existing&&existing.mood){
    selMood=existing.mood;
    var ec=grid.querySelector('[data-mood="'+existing.mood+'"]');
    if(ec)ec.classList.add('selected');
    $('recordSave').className='sheet-btn sheet-btn-primary';
    $('recordNote').value=existing.note||'';
  }else{
    $('recordSave').className='sheet-btn sheet-btn-disabled';
    $('recordNote').value='';
  }
  openSheet('recordSheet');
}

/* ===== Save/Delete Actions ===== */
async function saveMoodRecord(){
  if(!selMood)return;
  var dstr=ms(curYear,curMonth)+'-'+pad2(selDay);
  var note=$('recordNote').value.trim();
  var rec={date:dstr,type:'mood',who:selWho,mood:selMood,note:note};
  upsertLocal(rec);renderAll();showToast('心情已记录 ✓','success');closeSheet('recordSheet');
  try{await fetch(BASE+'/api/moods',{method:'POST',headers:H,body:JSON.stringify(normalizeRec(rec))})}catch(e){}
}
async function deleteMood(dstr){
  records=records.filter(function(r){return!(r.date===dstr&&r.type==='mood')});
  writeLocal();renderAll();closeSheet('detailSheet');showToast('心情记录已删除','success');
  try{await fetch(BASE+'/api/moods/'+dstr,{method:'DELETE',headers:H})}catch(e){}
}
async function savePeriodMark(dstr,phase){
  var rec={date:dstr,type:'period',phase:phase,mood:'',note:''};
  upsertLocal(rec);renderAll();showToast(phase==='start'?'经期开始已标记 🌙':'经期结束已标记 ✓','success');
  try{await fetch(BASE+'/api/moods',{method:'POST',headers:H,body:JSON.stringify(normalizeRec(rec))})}catch(e){}
}
async function deletePeriod(dstr){
  records=records.filter(function(r){return!(r.date===dstr&&r.type==='period')});
  writeLocal();renderAll();closeSheet('detailSheet');showToast('经期标记已删除','success');
  try{await fetch(BASE+'/api/moods/'+dstr,{method:'DELETE',headers:H})}catch(e){}
}
function saveSettingsAction(){
  settings={cycle_length:editCycle,period_length:editPeriod};
  saveJSON(SETTINGS_KEY,settings);renderAll();closeSheet('settingsSheet');showToast('周期设置已保存 ✓','success');
}

/* ===== Load Data ===== */
var calendarSyncTimer=null;
function calendarStatePayload(){
  return{settings:settings,courses:courseData,events:eventsData,periodDetails:Object.keys(periodDetails).map(function(date){return Object.assign({date:date},periodDetails[date])})};
}
function queueCalendarSync(){
  clearTimeout(calendarSyncTimer);
  calendarSyncTimer=setTimeout(function(){
    fetch(BASE+'/api/calendar/state',{method:'PUT',headers:H,body:JSON.stringify(calendarStatePayload())})
      .then(function(r){if(!r.ok)throw new Error('sync failed');localStorage.setItem(CALENDAR_MIGRATION_KEY,'1')})
      .catch(function(e){console.warn('日历同步失败，已保留本地副本',e)});
  },350);
}
function applyRemoteCalendarState(state){
  if(!state)return;
  if(state.settings){settings={cycle_length:state.settings.cycle_length||28,period_length:state.settings.period_length||5};saveJSON(SETTINGS_KEY,settings)}
  if(state.courses){courseData={semester_start:state.courses.semester_start||'',courses:Array.isArray(state.courses.courses)?state.courses.courses:[]};saveJSON(COURSE_KEY,courseData)}
  if(Array.isArray(state.events)){eventsData=state.events;saveJSON(EVENTS_KEY,eventsData)}
  if(Array.isArray(state.periodDetails)){periodDetails={};state.periodDetails.forEach(function(item){if(item&&item.date){var copy=Object.assign({},item);delete copy.date;periodDetails[item.date]=copy}});saveJSON(PDETAIL_KEY,periodDetails)}
}
async function migrateLocalMoodAndPeriodRecords(){
  if(localStorage.getItem(CALENDAR_RECORDS_MIGRATION_KEY)==='1')return;
  var pending=records.filter(function(record){return record&&record.date&&(record.type==='mood'||record.type==='period')});
  if(!pending.length){localStorage.setItem(CALENDAR_RECORDS_MIGRATION_KEY,'1');return}
  var results=await Promise.all(pending.map(async function(record){
    var response=await fetch(BASE+'/api/moods',{method:'POST',headers:H,body:JSON.stringify(normalizeRec(record))});
    if(!response.ok)throw new Error('mood migration failed');
    return response.json();
  }));
  records=uniqueRecs([].concat(results,records));writeLocal();
  localStorage.setItem(CALENDAR_RECORDS_MIGRATION_KEY,'1');
}
async function init(){
  $('calGrid').innerHTML='<div class="cal-skeleton-grid">'+Array.from({length:35}).map(function(){return'<div class="cal-skeleton"></div>'}).join('')+'</div>';
  var remote=[];
  try{var r=await fetch(BASE+'/api/moods',{headers:H});if(!r.ok)throw 0;remote=await r.json()}catch(e){console.warn('加载数据失败，使用本地记录',e)}
  records=uniqueRecs([].concat(Array.isArray(remote)?remote:[],readLocal()));writeLocal();
  try{await migrateLocalMoodAndPeriodRecords()}catch(e){console.warn('心情和经期记录迁移失败，稍后会自动重试',e)}
  try{
    var stateResponse=await fetch(BASE+'/api/calendar/state',{headers:H});
    if(!stateResponse.ok)throw new Error('calendar state unavailable');
    var state=await stateResponse.json();
    if(localStorage.getItem(CALENDAR_MIGRATION_KEY)!=='1'){
      await fetch(BASE+'/api/calendar/state',{method:'PUT',headers:H,body:JSON.stringify(calendarStatePayload())});
      localStorage.setItem(CALENDAR_MIGRATION_KEY,'1');
      stateResponse=await fetch(BASE+'/api/calendar/state',{headers:H});state=await stateResponse.json();
    }
    applyRemoteCalendarState(state);
  }catch(e){
    console.warn('日历扩展数据仍使用本地副本',e);
    // Calendar events have their own stable API. Keep AI-created events visible
    // even if optional settings/course tables are temporarily unavailable.
    try{var eventResponse=await fetch(BASE+'/api/calendar',{headers:H});if(eventResponse.ok){eventsData=await eventResponse.json();saveJSON(EVENTS_KEY,eventsData)}}catch(eventError){console.warn('日程降级读取失败',eventError)}
  }
  renderAll();
}
init();
