<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff">
<title>陪伴记录 · Iris and Rei</title><script src="init.js"></script><link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>
body{background:var(--bg);color:var(--text)}.stats-wrap{max-width:560px;margin:0 auto;padding:28px 18px calc(98px + env(safe-area-inset-bottom));box-sizing:border-box}.stats-header{position:relative;text-align:center;padding:18px 0 27px}.stats-title-row{display:inline-flex;align-items:center;justify-content:center;gap:8px}.stats-title{margin:0;font:400 34px/1.05 var(--font-d);letter-spacing:.04em}.role-switch{display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--accent);cursor:pointer}.role-switch svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.stats-sub{margin:8px 0 0;color:var(--text-light);font:400 12px/1.5 var(--font-en);letter-spacing:.07em}.role-menu{position:absolute;z-index:4;top:68px;left:50%;display:none;width:min(265px,calc(100vw - 48px));padding:7px;transform:translateX(-50%);border:1px solid var(--border);border-radius:16px;background:var(--bg-card);box-shadow:var(--shadow-md);text-align:left}.role-menu.open{display:grid;gap:2px}.role-choice{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:0;border-radius:11px;background:transparent;color:var(--text);font:14px var(--font-b);text-align:left;cursor:pointer}.role-choice.active{background:var(--accent-pale)}.role-avatar{display:grid;place-items:center;width:28px;height:28px;overflow:hidden;border-radius:50%;background:var(--bg-secondary);color:var(--accent);font:13px var(--font-d);flex:none}.role-avatar img{width:100%;height:100%;object-fit:cover}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric,.section{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-card);box-shadow:var(--shadow-sm)}.metric{padding:18px}.metric b{display:block;color:var(--accent);font:400 32px/1 var(--font-d)}.metric span{display:block;margin-top:9px;color:var(--text-light);font-size:12px;letter-spacing:.04em}.section{margin-top:18px;padding:18px}.section-title{margin:0 0 14px;font:400 15px/1 var(--font-en);color:var(--text);letter-spacing:.11em}.scene-row,.record-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border)}.scene-row:first-child,.record-row:first-child{border-top:0}.scene-name{display:flex;align-items:center;gap:9px;font-size:14px}.scene-icon{display:grid;place-items:center;width:22px;height:22px;color:var(--accent)}.scene-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.scene-row small,.record-row time{color:var(--text-light);font-size:12px;white-space:nowrap}.record-copy{min-width:0}.record-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:400}.record-copy span{display:block;margin-top:3px;color:var(--text-light);font-size:11px}.empty{padding:20px 0;color:var(--text-light);font-size:13px;text-align:center}.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px}.pager button{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--bg);color:var(--text);cursor:pointer}.pager button:disabled{opacity:.34;cursor:default}.pager svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pager span{min-width:60px;color:var(--text-light);font-size:12px;text-align:center}
.records-clear{margin-top:13px;padding:7px 11px;border:1px solid color-mix(in srgb,#b05b5b 42%,var(--border));border-radius:9px;background:transparent;color:#a44f4f;font:12px var(--font-b);cursor:pointer}.records-clear:disabled{opacity:.38;cursor:default}.record-tools{display:flex;align-items:center;gap:8px}.record-delete{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:9px;background:transparent;color:var(--text-light);cursor:pointer}.record-delete:hover{background:#f8eaea;color:#a44f4f}.record-delete svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<header class="top-bar"><div class="top-bar-left"><div class="top-bar-avatar" id="topBarAvatar"></div><span class="top-bar-title" id="topBarTitle"></span></div><a href="index.html" class="top-bar-right top-bar-home" aria-label="返回首页" style="display:grid;place-items:center;width:34px;height:34px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/></svg></a></header>
<main class="stats-wrap"><header class="stats-header"><div class="stats-title-row"><h1 class="stats-title">陪伴记录</h1><button class="role-switch" id="roleSwitch" type="button" aria-label="切换角色" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-3.4 3.2-5.2 6.5-5.2s5.8 1.8 6.5 5.2"/></svg></button></div><p class="stats-sub">A record of the moments we share.</p><button type="button" class="records-clear" id="clearRecords">清空所有陪伴记录</button><div class="role-menu" id="roleMenu"></div></header><section class="metrics"><div class="metric"><b id="days">0</b><span>陪伴天数</span></div><div class="metric"><b id="hours">0.0</b><span>累计小时</span></div></section><section class="section"><h2 class="section-title">BY SCENE</h2><div id="sceneRows"></div></section><section class="section"><h2 class="section-title">RECENT RECORDS</h2><div id="recentRows"></div><div class="pager" id="pager" hidden><button id="newer" type="button" aria-label="查看更新记录"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><span id="pageLabel">1 / 1</span><button id="older" type="button" aria-label="查看更早记录"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></div></section></main>
<nav class="dock"><a href="index.html" class="dock-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-10h6v10"/></svg><span class="dock-label">首页</span></a><a href="memories.html" class="dock-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="dock-label">记忆</span></a><a href="chat.html" class="dock-center"><div class="dock-center-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><span class="dock-label">聊天</span></a><a href="calendar.html" class="dock-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span class="dock-label">日历</span></a><a href="more.html" class="dock-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="dock-label">更多</span></a></nav>
<script>
(()=>{const H={'x-api-key':'iris-memory-2024'},$=id=>document.getElementById(id),PAGE=5;
const icon={study:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8"/></svg>',vocabulary:'<svg viewBox="0 0 24 24"><path d="M4 19 10 5l6 14M6.2 14h7.6M17.5 5h3M19 3.5v3"/></svg>',exercise:'<svg viewBox="0 0 24 24"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M8 12h8M6 7v10M18 7v10"/></svg>',nap:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',night:'<svg viewBox="0 0 24 24"><path d="M20 15.6A8.5 8.5 0 0 1 8.4 4 8.5 8.5 0 1 0 20 15.6z"/><path d="M16.5 4.5v3M15 6h3"/></svg>',bath:'<svg viewBox="0 0 24 24"><path d="M4 13h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM7 13V9a3 3 0 0 1 6 0v1M3 20h18"/></svg>',custom:'<svg viewBox="0 0 24 24"><path d="m12 3 1.4 5.2L18.5 10l-5.1 1.6L12 17l-1.4-5.4L5.5 10l5.1-1.8z"/></svg>'};
const scenes=[['study','学习'],['vocabulary','背单词'],['exercise','运动'],['nap','午睡'],['night','夜间休息'],['bath','沐浴'],['custom','Other']];let sessions=[],roles=[],roleId='',page=0;
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(p,opt={})=>{const r=await fetch(p,{...opt,headers:{...H,...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'加载失败');return d};const kind=s=>s.scene==='sleep'?(s.sleepMode==='night'?'night':'nap'):s.scene;const label=s=>scenes.find(x=>x[0]===kind(s))?.[1]||'Other';const minutes=s=>Math.max(0,Math.round((new Date(s.endedAt||s.updatedAt)-new Date(s.startedAt||s.createdAt))/60000));const time=m=>m>=60?(m/60).toFixed(m%60?1:0)+' 小时':m+' 分钟';const date=d=>new Date(d).toLocaleDateString('zh-CN',{year:'numeric',month:'numeric',day:'numeric'});const records=()=>sessions.filter(s=>s.endedAt&&s.roleId===roleId);const endedRecords=()=>sessions.filter(s=>s.endedAt&&s.status==='ended');const trash='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>';
function roleAvatar(r){return r.avatar?'<img src="'+esc(r.avatar)+'" alt="">':'<span>'+esc((r.name||'T')[0].toUpperCase())+'</span>'}function renderMenu(){const menu=$('roleMenu');menu.innerHTML=roles.map(r=>'<button class="role-choice '+(r.id===roleId?'active':'')+'" data-role="'+esc(r.id)+'"><i class="role-avatar">'+roleAvatar(r)+'</i>'+esc(r.name)+'</button>').join('')||'<div class="empty">还没有角色卡</div>';menu.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{roleId=b.dataset.role;page=0;localStorage.setItem('iris-companion-stats-role-id',roleId);menu.classList.remove('open');$('roleSwitch').setAttribute('aria-expanded','false');renderMenu();render()})}
function render(){const list=records(),by=Object.fromEntries(scenes.map(x=>[x[0],0])),dates=new Set();let total=0;list.forEach(s=>{const m=minutes(s);total+=m;dates.add(date(s.startedAt||s.createdAt));by[kind(s)]=(by[kind(s)]||0)+m});$('days').textContent=dates.size;$('hours').textContent=(total/60).toFixed(1);$('clearRecords').disabled=!endedRecords().length;$('sceneRows').innerHTML=scenes.map(([id,name])=>'<div class="scene-row"><span class="scene-name"><i class="scene-icon">'+icon[id]+'</i>'+name+'</span><small>'+time(by[id])+'</small></div>').join('');const pages=Math.max(1,Math.ceil(list.length/PAGE));page=Math.min(page,pages-1);const visible=list.slice(page*PAGE,page*PAGE+PAGE);$('recentRows').innerHTML=visible.length?visible.map(s=>'<div class="record-row"><div class="record-copy"><strong>'+esc(s.name||label(s))+'</strong><span>'+label(s)+' · '+time(minutes(s))+'</span></div><div class="record-tools"><time>'+date(s.endedAt||s.startedAt)+'</time><button type="button" class="record-delete" data-delete-record="'+esc(String(s.id))+'" aria-label="删除这条陪伴记录" title="删除记录">'+trash+'</button></div></div>').join(''):'<div class="empty">这个角色还没有完成的陪伴记录</div>';$('pager').hidden=list.length<=PAGE;$('pageLabel').textContent=(page+1)+' / '+pages;$('newer').disabled=page===0;$('older').disabled=page>=pages-1;$('recentRows').querySelectorAll('[data-delete-record]').forEach(button=>button.onclick=()=>deleteRecord(button.dataset.deleteRecord))}
async function deleteRecord(id){const record=sessions.find(s=>s.id===id);if(!record||!confirm('删除“'+(record.name||label(record))+'”这条陪伴记录吗？此操作不能恢复。'))return;try{await api('/api/companion/sessions/'+encodeURIComponent(id),{method:'DELETE'});sessions=sessions.filter(s=>s.id!==id);render()}catch(error){alert(error.message)}}
async function clearAllRecords(){const count=endedRecords().length;if(!count||!confirm('清空全部 '+count+' 条已结束的陪伴记录吗？此操作不能恢复；正在进行或暂停的房间不会被删除。'))return;try{await api('/api/companion/sessions',{method:'DELETE'});sessions=sessions.filter(s=>!(s.endedAt&&s.status==='ended'));page=0;render()}catch(error){alert(error.message)}}
function top(){const image=localStorage.getItem('iris_avatar_img1'),name=localStorage.getItem('iris_avatar_name1')||'Iris';$('topBarAvatar').innerHTML=image?'<img src="'+esc(image)+'" alt="">':'<span class="top-bar-avatar-initial">'+esc(name[0].toUpperCase())+'</span>';$('topBarTitle').textContent=localStorage.getItem('iris_topbar_title')||(name+'的小窝')}
async function init(){top();try{const [r,s]=await Promise.all([api('/api/chat/roles'),api('/api/companion/sessions')]);roles=r.roles||[];sessions=s.sessions||[];const saved=localStorage.getItem('iris-companion-stats-role-id'),latest=sessions.find(x=>x.endedAt&&roles.some(r=>r.id===x.roleId));roleId=roles.some(r=>r.id===saved)?saved:(latest?.roleId||roles[0]?.id||'');renderMenu();render()}catch(e){$('sceneRows').innerHTML='<div class="empty">记录暂时加载失败</div>';$('recentRows').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('roleSwitch').onclick=()=>{const open=$('roleMenu').classList.toggle('open');$('roleSwitch').setAttribute('aria-expanded',String(open))};$('clearRecords').onclick=clearAllRecords;$('newer').onclick=()=>{page--;render()};$('older').onclick=()=>{page++;render()};document.addEventListener('click',e=>{if(!e.target.closest('.stats-header')){$('roleMenu').classList.remove('open');$('roleSwitch').setAttribute('aria-expanded','false')}});init()})();
</script></body></html>
