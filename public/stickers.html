<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>表情包库 · irisandclaude</title>
<script src="init.js"></script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300,1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:var(--bg);color:var(--text)}
.stickers-page{max-width:560px;margin:auto;padding:26px 18px calc(90px + env(safe-area-inset-bottom));box-sizing:border-box}
.sticker-head{text-align:center;padding:13px 0 20px}.sticker-head h1{margin:0;font:400 34px/1.05 var(--font-d);letter-spacing:.05em}.sticker-head p{margin:8px 0 0;color:var(--text-light);font:400 12px var(--font-en);letter-spacing:.12em}
.library-note{display:flex;align-items:center;gap:10px;margin:0 0 17px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:color-mix(in srgb,var(--bg-card) 92%,var(--accent-pale));box-shadow:var(--shadow-xs);color:var(--text-mid);font:12px/1.55 var(--font-cn)}.library-note i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-pale);color:var(--accent);font:400 17px var(--font-d);font-style:normal;flex:none}
.pack-toolbar{display:flex;align-items:center;gap:8px;margin:0 -3px 14px;overflow:auto;padding:2px 3px 5px;scrollbar-width:none}.pack-toolbar::-webkit-scrollbar{display:none}.pack-chip{flex:none;min-height:34px;padding:0 13px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);color:var(--text-mid);font:12px var(--font-cn);white-space:nowrap;cursor:pointer}.pack-chip.active{border-color:var(--accent);background:var(--accent);color:var(--accent-contrast)}.pack-chip.add{display:grid;place-items:center;width:34px;padding:0;border-style:dashed;color:var(--accent);font-size:20px}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sticker-tile{position:relative;aspect-ratio:1;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--bg-card);box-shadow:var(--shadow-xs);cursor:pointer;-webkit-tap-highlight-color:transparent}.sticker-tile img{display:block;width:100%;height:100%;object-fit:cover}.sticker-tile:active{transform:scale(.97)}.sticker-upload{display:grid;place-items:center;border:1.5px dashed var(--accent-light);background:color-mix(in srgb,var(--bg-card) 74%,var(--accent-pale));color:var(--accent);box-shadow:none}.sticker-upload span{display:grid;place-items:center;width:31px;height:31px;margin:auto;border-radius:50%;background:var(--bg-card);font:300 27px/1 var(--font-en)}.sticker-upload small{position:absolute;bottom:12px;width:100%;color:var(--text-mid);font:11px var(--font-cn);text-align:center}.sticker-more{position:absolute;top:5px;right:5px;width:25px;height:25px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.86);color:var(--text-mid);font-size:17px;line-height:1;cursor:pointer;opacity:0}.sticker-tile:hover .sticker-more,.sticker-tile:focus-within .sticker-more{opacity:1}.sticker-badges{position:absolute;right:5px;bottom:5px;display:flex;gap:3px}.sticker-badge{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:rgba(74,63,60,.74);color:#fff;font:11px var(--font-cn)}.empty-library{grid-column:1/-1;padding:45px 18px;color:var(--text-light);font:13px var(--font-cn);text-align:center}.empty-library strong{display:block;margin-bottom:6px;color:var(--text-mid);font:400 20px var(--font-d)}
.sheet{position:fixed;z-index:800;inset:0;display:none;align-items:flex-end;background:rgba(40,33,31,.25);backdrop-filter:blur(5px)}.sheet.open{display:flex}.sheet-panel{width:100%;max-height:min(84dvh,720px);overflow:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--bg-card);box-shadow:0 -12px 38px rgba(var(--shadow-color),.16)}.sheet-grab{width:42px;height:5px;margin:0 auto 16px;border-radius:99px;background:var(--border)}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.sheet-head h2{margin:0;font:400 24px var(--font-d)}.sheet-close{width:32px;height:32px;border:0;border-radius:50%;background:var(--bg-secondary);color:var(--text-mid);font-size:20px;cursor:pointer}.sticker-editor{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}.sticker-editor-preview{width:96px;height:96px;overflow:hidden;border-radius:16px;background:var(--bg-secondary);border:1px solid var(--border)}.sticker-editor-preview img{width:100%;height:100%;object-fit:cover}.field{margin:0 0 12px}.field label{display:block;margin-bottom:5px;color:var(--text-light);font:12px var(--font-cn)}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:13px var(--font-cn)}.field textarea{min-height:72px;resize:vertical}.role-preferences{display:grid;gap:8px;margin:16px 0}.role-preferences>span{color:var(--text-light);font:12px var(--font-cn)}.role-preference-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:center;padding:8px 9px;border:1px solid var(--border);border-radius:12px;background:var(--bg)}.role-preference-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font:13px var(--font-cn);font-weight:400}.role-preference-row label{display:flex;align-items:center;gap:4px;color:var(--text-mid);font:11px var(--font-cn);white-space:nowrap}.role-preference-row input{accent-color:var(--accent)}.sheet-actions{display:flex;gap:8px;margin-top:16px}.sheet-actions button{flex:1;min-height:43px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-contrast);font:14px var(--font-cn);cursor:pointer}.sheet-actions .delete{background:#fff2f2;color:var(--error);border:1px solid #f2cccc}.sheet-actions button:disabled{opacity:.5}.new-pack{display:grid;gap:10px}.new-pack input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:14px var(--font-cn)}.new-pack-actions{display:flex;gap:8px}.new-pack-actions button{flex:1;padding:11px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-contrast);font:13px var(--font-cn)}.new-pack-actions .quiet{background:var(--bg-secondary);color:var(--text-mid)}
@media(max-width:380px){.stickers-page{padding-inline:14px}.sticker-grid{gap:8px}.sticker-editor{grid-template-columns:78px 1fr}.sticker-editor-preview{width:78px;height:78px}}
</style>
</head>
<body>
<header class="top-bar"><div class="top-bar-left"><div class="top-bar-avatar" id="topBarAvatar"></div><span class="top-bar-title" id="topBarTitle"></span></div><a href="index.html" class="top-bar-right top-bar-home" aria-label="返回首页" title="返回首页" style="display:grid;place-items:center;width:34px;height:34px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2z"/><path d="M9 22v-8h6v8"/></svg></a></header>
<main class="stickers-page"><header class="sticker-head"><h1>表情包库</h1><p>STICKER LIBRARY</p></header><div class="pack-toolbar" id="packToolbar"></div><section class="sticker-grid" id="stickerGrid" aria-label="表情包列表"></section></main>
<input id="stickerFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
<section class="sheet" id="editorSheet" aria-hidden="true"><div class="sheet-panel"><div class="sheet-grab"></div><div class="sheet-head"><h2>编辑表情包</h2><button class="sheet-close" type="button" data-close="editorSheet" aria-label="关闭">×</button></div><div class="sticker-editor"><div class="sticker-editor-preview"><img id="editImage" alt="表情包预览"></div><div><div class="field"><label for="editName">名称</label><input id="editName" maxlength="60" placeholder="例如：委屈小狗"></div><div class="field"><label for="editPack">所属包</label><select id="editPack"></select></div></div></div><div class="field"><label for="editTags">标签（用空格或逗号分开）</label><input id="editTags" maxlength="150" placeholder="例如：撒娇，委屈，求安慰"></div><div class="field"><label for="editDescription">给 AI 的描述</label><textarea id="editDescription" maxlength="240" placeholder="例如：眼泪汪汪地看着你，想被抱抱的小狗"></textarea></div><div class="field"><label for="editWeight">基础抽取概率（所有绑定角色）</label><select id="editWeight"><option value="1">普通</option><option value="2">常用</option><option value="3">偏好</option><option value="4">很常用</option><option value="5">高优先级</option></select></div><div class="role-preferences" id="editRolePreferences"></div><div class="sheet-actions"><button class="delete" id="deleteSticker" type="button">删除</button><button id="saveSticker" type="button">保存</button></div></div></section>
<section class="sheet" id="packSheet" aria-hidden="true"><div class="sheet-panel"><div class="sheet-grab"></div><div class="sheet-head"><h2>新建表情包包</h2><button class="sheet-close" type="button" data-close="packSheet" aria-label="关闭">×</button></div><div class="new-pack"><input id="packName" maxlength="40" placeholder="例如：开心包"><div class="new-pack-actions"><button class="quiet" type="button" data-close="packSheet">取消</button><button type="button" id="createPack">创建</button></div></div></div></section>
<nav class="dock"><a href="index.html" class="dock-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-10h6v10"/></svg><span class="dock-label">Home</span></a><a href="memories.html" class="dock-item"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="dock-label">Memories</span></a><a href="chat.html" class="dock-center"><div class="dock-center-btn"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><span class="dock-label">Chat</span></a><a href="calendar.html" class="dock-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="dock-label">Calendar</span></a><a href="more.html" class="dock-item active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="dock-label">More</span></a></nav>
<script>
(()=>{const API_KEY='iris-memory-2024',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let library={packs:[],stickers:[]},roles=[],activePack='all',editing=null,hold=null;
const api=async(path,opt={})=>{const response=await fetch(path,{...opt,headers:{'x-api-key':API_KEY,'Content-Type':'application/json',...(opt.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'操作失败');return data};
const currentRole=()=>roles[0]||null;const roleConfig=()=>({enabled:false,allPacks:false,packIds:[],perPackLimit:8,totalLimit:32,refreshEvery:8,signatureIds:[],favoriteIds:[],...(currentRole()?.stickerConfig||{})});
function updateTop(){const n=localStorage.getItem('iris_avatar_name1')||'Iris',im=localStorage.getItem('iris_avatar_img1');$('topBarAvatar').innerHTML=im?'<img src="'+esc(im)+'" alt="">':'<span class="top-bar-avatar-initial">'+esc(n[0])+'</span>';$('topBarTitle').textContent=localStorage.getItem('iris_topbar_title')||(n+'的小窝')}
function openSheet(id){$(id).classList.add('open');$(id).setAttribute('aria-hidden','false')}function closeSheet(id){$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true')}
function chips(){const source=[['all','全部'],['none','未分类'],...library.packs.map(p=>[p.id,p.name])];$('packToolbar').innerHTML=source.map(([id,name])=>'<button class="pack-chip '+(activePack===id?'active':'')+'" data-pack="'+esc(id)+'">'+esc(name)+'</button>').join('')+'<button class="pack-chip add" id="addPack" aria-label="新建表情包包">＋</button>';document.querySelectorAll('[data-pack]').forEach(button=>button.onclick=()=>{activePack=button.dataset.pack;render()});$('addPack').onclick=()=>{ $('packName').value='';openSheet('packSheet');setTimeout(()=>$('packName').focus(),120)}}
function isFav(id){return roleConfig().favoriteIds.includes(id)}function isSignature(id){return roleConfig().signatureIds.includes(id)}
function configForRole(role){return {enabled:false,allPacks:false,packIds:[],perPackLimit:8,totalLimit:32,refreshEvery:8,signatureIds:[],favoriteIds:[],...(role?.stickerConfig||{})}}
function renderRolePreferences(stickerId){const host=$('editRolePreferences');if(!roles.length){host.innerHTML='<span>还没有已保存的角色卡。</span>';return}host.innerHTML='<span>绑定角色卡</span>'+roles.map(role=>{const config=configForRole(role);return '<div class="role-preference-row"><strong>'+esc(role.name||'未命名角色')+'</strong><label><input type="checkbox" data-role-pref="favorite" data-role-id="'+esc(role.id)+'" '+(config.favoriteIds.includes(stickerId)?'checked':'')+'>常用</label><label><input type="checkbox" data-role-pref="signature" data-role-id="'+esc(role.id)+'" '+(config.signatureIds.includes(stickerId)?'checked':'')+'>招牌</label></div>'}).join('')}
function render(){chips();const items=library.stickers.filter(item=>activePack==='all'||(activePack==='none'?!item.packId:item.packId===activePack));const tiles=['<button class="sticker-tile sticker-upload" id="uploadSticker" type="button"><span>＋</span><small>上传表情</small></button>',...items.map(item=>'<article class="sticker-tile" tabindex="0" data-sticker="'+esc(item.id)+'"><img src="'+esc(item.imageUrl)+'" alt="'+esc(item.name||'表情包')+'"><button class="sticker-more" type="button" data-edit="'+esc(item.id)+'" aria-label="编辑表情包">⋯</button><div class="sticker-badges">'+(isSignature(item.id)?'<i class="sticker-badge">招牌</i>':'')+(isFav(item.id)?'<i class="sticker-badge">常用</i>':'')+'</div></article>')];if(!items.length)tiles.push('<div class="empty-library"><strong>先收下第一张小表情吧</strong>上传后，轻点聊天里的 + 就能直接发送。</div>');$('stickerGrid').innerHTML=tiles.join('');$('uploadSticker').onclick=()=>$('stickerFile').click();document.querySelectorAll('[data-edit]').forEach(button=>button.onclick=e=>{e.stopPropagation();openEditor(button.dataset.edit)});document.querySelectorAll('[data-sticker]').forEach(node=>{node.oncontextmenu=e=>{e.preventDefault();openEditor(node.dataset.sticker)};node.onpointerdown=e=>{if(e.button>0)return;hold={id:node.dataset.sticker,x:e.clientX,y:e.clientY,timer:setTimeout(()=>{if(hold)openEditor(hold.id);hold=null},520)}};node.onpointermove=e=>{if(hold&&(Math.abs(e.clientX-hold.x)>10||Math.abs(e.clientY-hold.y)>10)){clearTimeout(hold.timer);hold=null}};node.onpointerup=()=>{if(hold){clearTimeout(hold.timer);hold=null}}})}
function setPackOptions(selected){$('editPack').innerHTML='<option value="">未分类</option>'+library.packs.map(pack=>'<option value="'+esc(pack.id)+'">'+esc(pack.name)+'</option>').join('');$('editPack').value=selected||''}
function openEditor(id){editing=library.stickers.find(item=>item.id===id);if(!editing)return;$('editImage').src=editing.imageUrl;$('editName').value=editing.name||'';setPackOptions(editing.packId);$('editTags').value=(editing.tags||[]).join('，');$('editDescription').value=editing.description||'';$('editWeight').value=String(editing.aiWeight||1);renderRolePreferences(id);openSheet('editorSheet')}
async function savePrefs(){if(!editing)return;const id=editing.id,choices=Array.from(document.querySelectorAll('[data-role-pref]'));const saved=await Promise.all(roles.map(async role=>{const config=configForRole(role);config.favoriteIds=config.favoriteIds.filter(value=>value!==id);config.signatureIds=config.signatureIds.filter(value=>value!==id);if(choices.some(input=>input.dataset.roleId===role.id&&input.dataset.rolePref==='favorite'&&input.checked))config.favoriteIds.push(id);if(choices.some(input=>input.dataset.roleId===role.id&&input.dataset.rolePref==='signature'&&input.checked))config.signatureIds.push(id);return await api('/api/chat/roles/'+encodeURIComponent(role.id),{method:'PUT',body:JSON.stringify({stickerConfig:config})})}));roles=saved}
async function saveEditor(){if(!editing)return;const button=$('saveSticker');button.disabled=true;try{const tags=$('editTags').value.split(/[，,\s]+/).map(x=>x.trim()).filter(Boolean);const saved=await api('/api/chat/stickers/'+encodeURIComponent(editing.id),{method:'PUT',body:JSON.stringify({name:$('editName').value,packId:$('editPack').value||null,tags,description:$('editDescription').value,aiWeight:+$('editWeight').value})});library.stickers=library.stickers.map(item=>item.id===saved.id?saved:item);await savePrefs();closeSheet('editorSheet');render()}catch(error){alert(error.message)}finally{button.disabled=false}}
async function upload(files){const picked=Array.from(files).slice(0,20);for(const file of picked){if(file.size>5*1024*1024){alert(file.name+' 超过 5MB，已跳过');continue}const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('图片读取失败'));r.readAsDataURL(file)});const saved=await api('/api/chat/stickers',{method:'POST',body:JSON.stringify({dataUrl,name:file.name.replace(/\.[^.]+$/,''),packId:activePack==='all'||activePack==='none'?null:activePack})});library.stickers.push(saved)}render()}
async function init(){updateTop();try{const [data,roleData]=await Promise.all([api('/api/chat/stickers'),api('/api/chat/roles')]);library=data;roles=roleData.roles||[];render()}catch(error){$('stickerGrid').innerHTML='<div class="empty-library"><strong>暂时无法打开表情包库</strong>'+esc(error.message)+'</div>'}}
$('stickerFile').onchange=async e=>{try{await upload(e.target.files)}catch(error){alert(error.message)}finally{e.target.value=''}};$('createPack').onclick=async()=>{const name=$('packName').value.trim();if(!name)return $('packName').focus();try{const saved=await api('/api/chat/sticker-packs',{method:'POST',body:JSON.stringify({name})});library.packs.push(saved);activePack=saved.id;closeSheet('packSheet');render()}catch(error){alert(error.message)}};$('saveSticker').onclick=saveEditor;$('deleteSticker').onclick=async()=>{if(!editing||!confirm('删除这张表情包？历史聊天中的图片不会受影响。'))return;try{await api('/api/chat/stickers/'+encodeURIComponent(editing.id),{method:'DELETE'});library.stickers=library.stickers.filter(item=>item.id!==editing.id);closeSheet('editorSheet');render()}catch(error){alert(error.message)}};document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>closeSheet(button.dataset.close));document.querySelectorAll('.sheet').forEach(sheet=>sheet.onclick=e=>{if(e.target===sheet)closeSheet(sheet.id)});init()})();
</script>
</body>
</html>
