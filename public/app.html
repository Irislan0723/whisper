html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}#playerFrame{z-index:2;left:-120vw;transition:left .18s ease}#playerFrame.active{left:0}#viewFrame{z-index:1}.float-root{position:fixed;z-index:10000;display:flex;align-items:center;gap:0;max-width:calc(100vw - 24px);touch-action:none}.float-root.right{flex-direction:row-reverse}.float-disc{position:relative;z-index:2;display:grid;place-items:center;flex:0 0 58px;width:58px;height:58px;padding:0;overflow:hidden;border:0;border-radius:50%;background:repeating-radial-gradient(circle,#333 0 2px,#111 3px 5px);box-shadow:0 8px 22px rgba(0,0,0,.28);color:#fff;cursor:pointer}.float-disc img{width:74%;height:74%;border-radius:50%;object-fit:cover}.float-disc .empty-note{font-size:23px}.float-root.playing .float-disc{animation:floatSpin 9s linear infinite}@keyframes floatSpin{to{transform:rotate(360deg)}}.float-panel{display:flex;align-items:center;min-width:0;max-width:0;height:52px;overflow:hidden;opacity:0;border-radius:999px;background:rgba(255,255,255,.98);box-shadow:0 8px 22px rgba(40,30,27,.18);transition:max-width .22s ease,opacity .18s ease;padding:0}.float-root.left.expanded .float-panel,.float-root.right.expanded .float-panel{width:min(278px,calc(100vw - 90px));max-width:min(278px,calc(100vw - 90px));padding:0 7px 0 13px;opacity:1}.float-root.right.expanded .float-panel{padding:0 13px 0 7px}.float-copy{min-width:0;flex:1;padding:0 8px;color:#342b28;text-align:left;cursor:pointer}.float-copy strong,.float-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.float-copy strong{font:600 12px/1.35 system-ui,sans-serif}.float-copy span{margin-top:2px;color:#857a76;font:11px/1.3 system-ui,sans-serif}.float-action,.float-menu{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:transparent;color:#705854;cursor:pointer}.float-actio h-head{display:flex;align-items:center;justify-content:space-between}.player-search-head h2{margin:0;font-size:22px}.player-search-head button{border:0;background:transparent;font-size:28px;color:#403632}.player-search form{display:flex;gap:8px;margin:15px 0}.player-search input{min-width:0;flex:1;padding:11px 13px;border:1px solid #ded6d3;border-radius:12px;background:#f5f8f8;color:#342b28;font:14px system-ui,sans-serif}.player-search form button,.search-play{border:0;border-radius:11px;background:#705854;color:#fff;padding:0 15px;font:13px system-ui,sans-serif}.search-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #eee7e4}.search-row img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#e9e2df}.search-row strong,.search-row span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.search-row strong{font-size:14px}.search-row span{margin-top:4px;color:#857a76;font-size:12px}.search-play{height:34px;padding:0 11px}.no-track{display:none}.float-root.idle .float-panel{display:none}
.float-copy{border:0;background:transparent}.float-disc .empty-note{display:none!important}.float-root.left .float-pop{right:0;left:auto}.float-root.right .float-pop{left:0;right:auto}.float-pop{grid-auto-flow:column;grid-auto-columns:38px;min-width:0;padding:6px}.float-pop button{display:grid;place-items:center;width:38px;height:38px;padding:0}.float-root.profile{right:12px!important;bottom:calc(70px + env(safe-area-inset-bottom))!important;left:12px!important;top:auto!important}.float-root.profile .float-menu{display:grid}

</style><style>#playerFrame{left:0!important;visibility:hidden;pointer-events:none;opacity:0;transition:opacity .18s ease}#playerFrame.active{visibility:visible;pointer-events:auto;opacity:1}</style></head><body>
<iframe id="viewFrame" title="页面内容"></iframe><iframe id="playerFrame" src="listening.html" title="听歌房间" allow="autoplay"></iframe>
<aside class="float-root right idle" id="floatRoot" aria-label="音乐播放器"><button class="float-disc" id="floatDisc" aria-label="展开播放器"><span class="empty-note" id="floatEmpty" hidden></span><img id="floatCover" hidden alt=""></button><section class="float-panel"><span class="float-copy" id="floatCopy"><strong id="floatTitle">还没有播放音乐</strong><span id="floatArtist">点唱片即可搜索</span></span><button class="float-action" id="floatPause" aria-label="播放或暂停"><svg viewBox="0 0 24"><path d="M9 6v12M15 6v12"/></svg></button><button class="float-action" id="goRoom" aria-label="进入听歌房间" title="进入听歌房间"><svg viewBox="0 0 24"><circle cx="8" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/><path d="M10.5 18V5l9-2v13"/></svg></button><button class="float-action" id="openSearch" aria-label="现场搜索歌曲" title="现场搜索歌曲"><svg viewBox="0 0 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg></button><button class="float-action" id="hideFloat" aria-label="隐藏悬浮播放器" title="隐藏悬浮播放器"><svg viewBox="0 0 24"><path d="m5 5 14 14M10 10a3 3 0 0 0 4 4M6.3 8.2C4.9 9.4 4 11 4 12c1.7 3.2 4.5 5 8 5 .9 0 1.8-.1 2.6-.4M9.2 7.3A8.8 8.8 0 0 1 12 7c3.5 0 6.3 1.8 8 5-.5 1-1.3 1.9-2.4 2.7"/></svg></button></section></aside>
<aside class="player-search" id="playerSearch" hidden><section class="player-search-card"><header class="player-search-head"><h2>搜索音乐</h2><button id="closeSearch" aria-label="关闭">×</button></header><form id="globalSearchForm"><input id="globalSearchQuery" autocomplete="off" placeholder="搜索歌名、歌手"><button id="clearGlobalSearch" type="button" aria-label="清空搜索" hidden>×</button><button>搜索</button></form><div id="globalSearchResults"></div></section></aside>
<script>
(()=>{
  const $=id=>document.getElementById(id),player=$('playerFrame'),view=$('viewFrame'),root=$('floatRoot'),same=url=>url.origin===location.origin,listen=url=>/\/listening\.html$/i.test(url.pathname),profile=url=>/\/listening-profile\.html$/i.test(url.pathname),safePath=value=>{const url=new URL(value,location.href);return same(url)?url.pathname.replace(/^\//,'')+url.search+url.hash:'index.html'};
  let playerReady=false,showingPlayer=false,drag=null,lastView='index.html';
  let floatHidden=false;try{floatHidden=localStorage.getItem('listen_global_player_hidden')==='1'}catch{}
  function setRootPosition(saved){const side=saved&&saved.side==='left'?'left':'right',top=Math.max(70,Math.min(innerHeight-150,Number(saved&&saved.top)||Math.round(innerHeight*.54)));root.classList.remove('left','right');root.classList.add(side);root.style.top=top+'px';root.style.bottom='auto';root.style[side]=saved&&Number.isFinite(saved.offset)?saved.offset+'px':'14px';root.style[side==='left'?'right':'left']='auto'}
  function saveRootPosition(){try{localStorage.setItem('iris_global_player_float',JSON.stringify({side:root.classList.contains('left')?'left':'right',top:parseFloat(root.style.top)||Math.round(innerHeight*.54),offset:14}))}catch{}}
  try{setRootPosition(JSON.parse(localStorage.getItem('iris_global_player_float')||'null'))}catch{setRootPosition(null)}
  function playerApi(){try{return player.contentWindow.IrisListeningPlayer||null}catch{return null}}
  function playerAudio(){try{return player.contentDocument.getElementById('audio')}catch{return null}}
  function state(){const api=playerApi(),audio=playerAudio();if(api?.state)return api.state();const title=player.contentDocument?.getElementById('title')?.childNodes?.[0]?.nodeValue?.trim()||'',artist=player.contentDocument?.getElementById('artist')?.textContent?.trim()||'',cover=player.contentDocument?.getElementById('cover')?.src||'';return{track:title?{songName:title,artistName:artist,coverUrl:cover}:null,playing:!!audio&&!audio.paused}}
  function paint(){if(!showingPlayer){player.classList.remove('active');view.style.pointerEvents='auto'}if(showingPlayer||floatHidden){root.hidden=true;return}root.hidden=false;const s=state(),track=s.track||null,has=!!track;root.classList.toggle('idle',!has);root.classList.toggle('playing',!!s.playing);$('floatTitle').textContent=track?.songName||'还没有播放音乐';$('floatArtist').textContent=track?.artistName||'点唱片即可搜索';$('floatCover').hidden=!track?.coverUrl;$('floatEmpty').hidden=!!track?.coverUrl;if(track?.coverUrl)$('floatCover').src=track.coverUrl;root.classList.remove('profile');}
  function setContent(path,push=true){const next=safePath(path);lastView=next;showingPlayer=false;player.classList.remove('active');view.style.pointerEvents='auto';if(view.getAttribute('src')!==next)view.src=next;if(push)history.pushState({view:next},'', 'app.html?view='+encodeURIComponent(next));paint()}
  function showPlayer(path,push=true){if(path&&player.contentWindow.location.href!==new URL(path,location.href).href)player.src=safePath(path);showingPlayer=true;root.hidden=true;player.classList.add('active');view.style.pointerEvents='none';if(push)history.pushState({view:'listening.html'},'', 'app.html?view=listening.html')}
  function routeFromFrame(frame,kind){const doc=frame.contentDocument;if(!doc)return;const isProfile=profile(new URL(doc.location.href));if(kind==='view'&&isProfile){doc.querySelectorAll('audio').forEach(audio=>audio.addEventListener('play',()=>audio.pause()));}doc.addEventListener('click',event=>{const playButton=event.target.closest&&event.target.closest('[data-play]');if(kind==='view'&&isProfile&&playButton){event.preventDefault();event.stopImmediatePropagation();(async()=>{try{const fresh=(await api('/api/listening/tracks/'+encodeURIComponent(playButton.dataset.play)+'/refresh',{method:'POST'})).track,runner=playerApi();if(!runner?.playTrack)throw Error('播放器正在准备，请稍后重试');await runner.playTrack(fresh);paint()}catch(error){alert(error.message)}})();return}const anchor=event.target.closest&&event.target.closest('a[href]');if(!anchor||event.defaultPrevented||anchor.target||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;let url;try{url=new URL(anchor.href,location.href)}catch{return}if(!same(url))return;if(listen(url)){event.preventDefault();showPlayer(safePath(url));return}if(kind==='player'){event.preventDefault();setContent(safePath(url));}},true)}
  player.addEventListener('load',()=>{playerReady=true;routeFromFrame(player,'player');paint()});view.addEventListener('load',()=>{routeFromFrame(view,'view');try{lastView=safePath(view.contentWindow.location.href);if(listen(new URL(lastView,location.href))){showPlayer(lastView,false);return}if(!showingPlayer)history.replaceState({view:lastView},'', 'app.html?view='+encodeURIComponent(lastView))}catch{}paint()});
  $('floatDisc').addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,left:root.getBoundingClientRect().left,top:root.getBoundingClientRect().top,moved:false};$('floatDisc').setPointerCapture(event.pointerId)});$('floatDisc').addEventListener('pointermove',event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;const nextLeft=Math.max(8,Math.min(innerWidth-66,drag.left+dx)),nextTop=Math.max(70,Math.min(innerHeight-140,drag.top+dy));root.style.left=nextLeft+'px';root.style.right='auto';root.style.top=nextTop+'px'});$('floatDisc').addEventListener('pointerup',event=>{if(!drag)return;const moved=drag.moved,left=root.getBoundingClientRect().left;const side=left+29<innerWidth/2?'left':'right';root.classList.remove('left','right');root.classList.add(side);root.style[side]='14px';root.style[side==='left'?'right':'left']='auto';saveRootPosition();drag=null;if(!moved){if(root.classList.contains('idle'))$('openSearch').click();else root.classList.toggle('expanded')}});
  $('floatPause').onclick=()=>{const api=playerApi(),audio=playerAudio();if(api?.toggle)api.toggle();else if(audio){if(audio.paused)audio.play().catch(()=>{});else audio.pause()}setTimeout(paint,30)};$('goRoom').onclick=()=>showPlayer('listening.html');$('hideFloat').onclick=()=>{floatHidden=true;try{localStorage.setItem('listen_global_player_hidden','1');localStorage.setItem('listen_global_player_enabled','1');const toggle=player.contentDocument?.getElementById('globalPlayerToggle');if(toggle)toggle.checked=false}catch{}paint()};
  const search=$('playerSearch'),globalQuery=$('globalSearchQuery'),clearGlobal=$('clearGlobalSearch'),syncGlobalClear=()=>{clearGlobal.hidden=!globalQuery.value};clearGlobal.onclick=()=>{globalQuery.value='';$('globalSearchResults').innerHTML='';syncGlobalClear();globalQuery.focus()};globalQuery.addEventListener('input',syncGlobalClear);const closeSearch=()=>{search.hidden=true};$('openSearch').onclick=()=>{search.hidden=false;globalQuery.focus()};$('closeSearch').onclick=closeSearch;search.addEventListener('click',event=>{if(event.target===search)closeSearch()});
  async function api(path,opt={}){const response=await fetch(path,{...opt,headers:{'x-api-key':'iris-memory-2024','Content-Type':'application/json',...(opt.headers||{})}}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'请求失败');return data}
  $('globalSearchForm').onsubmit=async event=>{event.preventDefault();const query=$('globalSearchQuery').value.trim(),out=$('globalSearchResults');if(!query){out.innerHTML='';return}out.textContent='正在搜索…';try{const data=await api('/api/listening/search',{method:'POST',body:JSON.stringify({query})});out.innerHTML=(data.tracks||[]).map(track=>'<article class="search-row"><img src="'+String(track.coverUrl||'').replace(/"/g,'%22')+'" alt=""><div><strong>'+String(track.songName||'').replace(/[&<>]/g,'')+'</strong><span>'+String(track.artistName||'').replace(/[&<>]/g,'')+'</span></div><button class="search-play" data-song="'+Number(track.songId)+'">播放</button></article>').join('')||'没有找到歌曲';out.querySelectorAll('[data-song]').forEach(button=>button.onclick=async()=>{try{const fresh=(await api('/api/listening/tracks/'+button.dataset.song+'/refresh',{method:'POST'})).track,runner=playerApi();if(!runner?.playTrack)throw Error('播放器正在准备，请稍后重试');await runner.playTrack(fresh);closeSearch();paint()}catch(error){alert(error.message)}})}catch(error){out.textContent=error.message}}
  window.IrisListeningShell={setFloatVisible(visible){floatHidden=!visible;try{localStorage.setItem('listen_global_player_enabled','1');if(visible)localStorage.removeItem('listen_global_player_hidden');else localStorage.setItem('listen_global_player_hidden','1')}catch{}paint()},openRoom(){showPlayer('listening.html')}};addEventListener('message',event=>{if(event.origin===location.origin&&event.data?.type==='iris-view-listening')showPlayer(safePath(event.data.href),false)});
  addEventListener('popstate',()=>{const wanted=new URLSearchParams(location.search).get('view')||'index.html';if(listen(new URL(wanted,location.href)))showPlayer(wanted,false);else setContent(wanted,false)});const initial=new URLSearchParams(location.search).get('view')||'index.html';if(listen(new URL(initial,location.href)))showPlayer(initial,false);else setContent(initial,false);setInterval(paint,650);
})();
</script><script>
/* Keep the compact control icon in lockstep with the persistent room audio. */
(()=>{const $=id=>document.getElementById(id),pause='<svg viewBox="0 0 24"><path d="M9 6v12M15 6v12"/></svg>',play='<svg viewBox="0 0 24"><path d="m9 6 9 6-9 6z" style="fill:currentColor;stroke:none"/></svg>';function paintIcon(){let audio=null;try{audio=$('playerFrame').contentDocument.getElementById('audio')}catch{}$('floatPause').innerHTML=audio&&!audio.paused?pause:play}setInterval(paintIcon,250);})();
</script></body></html>
