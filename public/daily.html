<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Moment · Iris and Rei</title>
  <script src="init.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    :root{--daily-bg:#edfafa;--daily-paper:#fff;--daily-text:#4d3f3b;--daily-muted:#a29793;--daily-accent:#80635e;--daily-line:#eadfdb}html{background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(150deg,#f9ffff,var(--daily-bg));color:var(--daily-text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.daily-global{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:11px;min-height:56px;padding:env(safe-area-inset-top) 20px 0;background:rgba(255,255,255,.92);border-bottom:1px solid rgba(128,99,94,.13);backdrop-filter:blur(13px)}.daily-global-avatar{display:grid;place-items:center;width:33px;height:33px;overflow:hidden;border-radius:50%;background:#e8f6f6;border:1px solid #c8e7e7}.daily-global-avatar img{width:100%;height:100%;object-fit:cover}.daily-global-name{flex:1;color:var(--daily-text);font:400 18px Georgia,"Noto Serif SC",serif}.daily-home{display:grid;place-items:center;width:36px;height:36px;color:var(--daily-accent)}.daily-home svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.daily-top{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:11;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:64px;padding:0 16px;border-bottom:1px solid rgba(128,99,94,.13);background:rgba(255,255,255,.86);backdrop-filter:blur(13px)}.daily-top h1{margin:0;text-align:center;font:400 25px/1.2 Georgia,"Noto Serif SC",serif}.daily-back{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--daily-accent);font-size:30px;cursor:pointer}.daily-page{max-width:720px;margin:auto;padding:25px 18px calc(100px + env(safe-area-inset-bottom))}.daily-tabs{display:flex;gap:8px;margin:0 0 22px}.daily-tabs button{flex:1;padding:10px 12px;border:1px solid var(--daily-line);border-radius:999px;background:rgba(255,255,255,.8);color:var(--daily-muted);font:14px inherit;cursor:pointer}.daily-tabs button.active{border-color:var(--daily-accent);background:var(--daily-accent);color:white}.daily-year{margin:26px 3px 11px;color:var(--daily-accent);font:400 23px Georgia,"Noto Serif SC",serif}.daily-month{margin:0 0 8px;color:var(--daily-muted);font-size:13px}.daily-row{display:flex;gap:10px;overflow-x:auto;padding:3px 3px 15px;scroll-snap-type:x proximity}.daily-card{position:relative;display:grid;align-content:start;flex:0 0 156px;min-height:164px;padding:15px;border:1px solid rgba(128,99,94,.14);border-radius:21px;background:var(--daily-paper);box-shadow:0 6px 19px rgba(89,67,59,.08);text-align:left;scroll-snap-align:start;cursor:pointer}.daily-card-head{display:flex;align-items:center;justify-content:space-between;gap:5px}.daily-card time{color:var(--daily-muted);font-size:11px}.daily-card-delete{display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:transparent;color:#b28b8b;cursor:pointer}.daily-card-delete svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.daily-card p{display:-webkit-box;margin:12px 0 0;overflow:hidden;color:var(--daily-text);font-size:14px;line-height:1.72;-webkit-line-clamp:4;-webkit-box-orient:vertical}.daily-empty{padding:90px 20px;text-align:center;color:var(--daily-muted)}.daily-detail{position:fixed;z-index:20;inset:0;display:none;place-items:center;padding:22px;background:rgba(58,45,40,.2);backdrop-filter:blur(7px)}.daily-detail.open{display:grid}.daily-detail-card{position:relative;width:min(420px,100%);padding:30px 23px 26px;border-radius:29px;background:white;box-shadow:0 20px 55px rgba(55,40,34,.2)}.daily-detail-close{position:absolute;top:13px;right:13px;width:34px;height:34px;border:0;border-radius:50%;background:#effafa;color:var(--daily-accent);font-size:24px;cursor:pointer}.daily-detail-person{display:grid;justify-items:center;gap:7px;padding:8px 44px 21px}.daily-detail-avatar{display:grid;place-items:center;width:76px;height:76px;overflow:hidden;border-radius:50%;background:#e4f4f4;border:3px solid white;box-shadow:0 4px 16px rgba(89,67,59,.15)}.daily-detail-avatar img{width:100%;height:100%;object-fit:cover}.daily-detail-avatar span{color:var(--daily-accent);font:28px Georgia,serif}.daily-detail-person strong{font:400 22px Georgia,"Noto Serif SC",serif}.daily-detail-person time{color:var(--daily-muted);font-size:11px}.daily-detail-copy{min-height:170px;padding:19px;border-radius:21px;background:#effafa}.daily-detail-copy small{display:block;margin-bottom:12px;color:var(--daily-accent);font:400 17px Georgia,"Noto Serif SC",serif}.daily-detail-copy p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.85}.daily-dock{position:fixed;z-index:13;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;min-height:72px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(128,99,94,.12);background:rgba(255,255,255,.94);backdrop-filter:blur(13px)}.daily-dock a{display:grid;justify-items:center;gap:3px;min-width:48px;color:#aaa29e;text-decoration:none;font-size:11px}.daily-dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65}.daily-dock .active{color:var(--daily-accent)}.daily-dock .active svg{padding:7px;box-sizing:content-box;border-radius:50%;background:var(--daily-accent);stroke:white}
    .daily-top{top:48px}.daily-global,.daily-dock{display:none}@media(max-width:480px){.daily-top{top:44px}}
  </style>
</head>
<body>
  <header class="top-bar"><div class="top-bar-left"><div class="top-bar-avatar" id="globalAvatar"></div><span class="top-bar-title" id="globalName">Our home</span></div><a href="index.html" class="top-bar-right top-bar-home" aria-label="返回首页"><svg width="22" height="22" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/></svg></a></header>
  <header class="daily-top"><button class="daily-back" type="button" aria-label="返回" onclick="history.length>1?history.back():location.href='chat.html'">‹</button><h1>Moment</h1><span></span></header>
  <main class="daily-page"><nav class="daily-tabs"><button class="active" data-author="claude">TA</button><button data-author="iris">我的</button></nav><div id="dailyTimeline"></div></main>
  <nav class="dock"><a href="index.html" class="dock-item"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span class="dock-label">Home</span></a><a href="memories.html" class="dock-item"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="dock-label">Memories</span></a><a href="chat.html" class="dock-center active"><div class="dock-center-btn"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><span class="dock-label">Chat</span></a><a href="calendar.html" class="dock-item"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="dock-label">Calendar</span></a><a href="more.html" class="dock-item"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="dock-label">More</span></a></nav>
  <section class="daily-detail" id="dailyDetail"><article class="daily-detail-card"><button class="daily-detail-close" type="button" aria-label="关闭">×</button><div class="daily-detail-person"><div class="daily-detail-avatar" id="detailAvatar"></div><strong id="detailName"></strong><time id="detailTime"></time></div><div class="daily-detail-copy"><small>Moment</small><p id="detailContent"></p></div></article></section>
  <script>
    const KEY='iris-memory-2024',params=new URLSearchParams(location.search),roleId=params.get('roleId')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let notes=[],role=null,profile=null,author='claude';
    const fmt=t=>new Date(t).toLocaleString('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}),month=t=>new Date(t).toLocaleDateString('zh-CN',{year:'numeric',month:'long'}),year=t=>String(new Date(t).getFullYear());
    function person(kind){return kind==='claude'?role:profile}function avatar(item){return item?.avatar?'<img src="'+esc(item.avatar)+'" alt="">':'<span>'+esc((item?.name||'TA').slice(0,1))+'</span>'}function trash(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M9 7l1-3h4l1 3M6 7l1 13h10l1-13"/></svg>'}
    function render(){const list=notes.filter(note=>note.author===author);const root=document.getElementById('dailyTimeline');if(!list.length){root.innerHTML='<p class="daily-empty">还没有留下 Moment。</p>';return}const buckets={};list.forEach(note=>{const key=year(note.createdAt)+'-'+month(note.createdAt);(buckets[key]??=[]).push(note)});root.innerHTML=Object.entries(buckets).map(([key,items])=>'<section><h2 class="daily-year">'+esc(items[0]?year(items[0].createdAt):'')+'</h2><p class="daily-month">'+esc(month(items[0].createdAt))+'</p><div class="daily-row">'+items.map(note=>'<article class="daily-card" tabindex="0" role="button" data-id="'+esc(note.id)+'"><div class="daily-card-head"><time>'+esc(fmt(note.createdAt))+'</time><button class="daily-card-delete" type="button" data-delete="'+esc(note.id)+'" aria-label="删除 Moment">'+trash()+'</button></div><p>'+esc(note.content)+'</p></article>').join('')+'</div></section>').join('');root.querySelectorAll('.daily-card[data-id]').forEach(card=>{card.onclick=e=>{if(!e.target.closest('[data-delete]'))openNote(notes.find(note=>note.id===card.dataset.id))};card.onkeydown=e=>{if(e.key==='Enter')openNote(notes.find(note=>note.id===card.dataset.id))}});root.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async e=>{e.stopPropagation();if(!confirm('删除这条 Moment？'))return;try{const response=await fetch('/api/chat/daily-notes/'+encodeURIComponent(button.dataset.delete),{method:'DELETE',headers:{'x-api-key':KEY}});if(!response.ok)throw new Error();notes=notes.filter(note=>note.id!==button.dataset.delete);render()}catch(error){alert('删除失败，请稍后重试。')}})}
    function openNote(note){if(!note)return;const p=person(note.author);document.getElementById('detailAvatar').innerHTML=avatar(p);document.getElementById('detailName').textContent=p?.name||'TA';document.getElementById('detailTime').textContent=fmt(note.createdAt);document.getElementById('detailContent').textContent=note.content;document.getElementById('dailyDetail').classList.add('open')}
    async function init(){if(!roleId){document.getElementById('dailyTimeline').innerHTML='<p class="daily-empty">请从聊天页进入当前角色的 Moment。</p>';return}try{const [roles,me,data]=await Promise.all([fetch('/api/chat/roles',{headers:{'x-api-key':KEY}}).then(r=>r.json()),fetch('/api/chat/profile',{headers:{'x-api-key':KEY}}).then(r=>r.json()),fetch('/api/chat/daily-notes?roleId='+encodeURIComponent(roleId),{headers:{'x-api-key':KEY}}).then(r=>r.json())]);role=(roles.roles||[]).find(item=>item.id===roleId)||null;profile=me;notes=data.notes||[];document.getElementById('globalAvatar').innerHTML=avatar(profile);render()}catch(error){document.getElementById('dailyTimeline').innerHTML='<p class="daily-empty">Moment 加载失败，请稍后再试。</p>'}}
    document.querySelectorAll('[data-author]').forEach(button=>button.onclick=()=>{author=button.dataset.author;document.querySelectorAll('[data-author]').forEach(item=>item.classList.toggle('active',item===button));render()});document.querySelector('.daily-detail-close').onclick=()=>document.getElementById('dailyDetail').classList.remove('open');document.getElementById('dailyDetail').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')};init();
  </script>
</body>
</html>
